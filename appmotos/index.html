<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oficina de Motos</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <h1 id="oficina-nome">Oficina de Motos</h1>
    <div class="header-actions">
      <button id="btn-sound" onclick="toggleSound()">🔊 SOM ON</button>
      <input type="text" id="global-search" placeholder="Buscar placa, cliente, telefone..." oninput="handleSearch(this.value)">
    </div>
  </header>

  <main id="app-content">
    <!-- DASHBOARD -->
    <section id="sec-dashboard" class="view-section active">
      <h2>Dashboard</h2>
      <div class="kpi-grid">
        <div class="kpi-card"><span>Clientes</span><strong id="kpi-clientes">0</strong></div>
        <div class="kpi-card"><span>Motos</span><strong id="kpi-motos">0</strong></div>
        <div class="kpi-card"><span>Manutenções</span><strong id="kpi-manutencoes">0</strong></div>
        <div class="kpi-card warning"><span>Retornos Hoje</span><strong id="kpi-hoje">0</strong></div>
        <div class="kpi-card danger"><span>Atrasados</span><strong id="kpi-atrasados">0</strong></div>
        <div class="kpi-card success"><span>Faturamento</span><strong id="kpi-faturamento">R$ 0,00</strong></div>
      </div>
    </section>

    <!-- CLIENTES -->
    <section id="sec-clientes" class="view-section">
      <h2>Gestão de Clientes</h2>
      <div class="action-bar" style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button class="btn-primary" onclick="openModal('modal-cliente')">+ Novo Cliente</button>
        <button class="btn-secondary" onclick="renderClientes()">👥 Clientes Cadastrados</button>
      </div>
      <div id="lista-clientes" class="card-list"></div>
    </section>

    <!-- MOTOS -->
    <section id="sec-motos" class="view-section">
      <h2>Gestão de Motos</h2>
      <div class="action-bar" style="display: flex; gap: 10px; margin-bottom: 15px;">
        <button class="btn-primary" onclick="openModal('modal-moto')">+ Nova Moto</button>
        <button class="btn-secondary" onclick="renderMotos()">🏍️ Motos Cadastradas</button>
      </div>
      <div id="lista-motos" class="card-list"></div>
    </section>

    <!-- RETORNOS / ALERTAS -->
    <section id="sec-retornos" class="view-section">
      <h2>Retornos / Alertas Cadastrados</h2>
      <div id="lista-retornos" class="card-list"></div>
    </section>

    <!-- MENU / CONFIGS / BACKUP -->
    <section id="sec-menu" class="view-section">
      <h2>Menu & Backup</h2>
      <div class="menu-actions">
        <button class="btn-secondary" onclick="exportBackup()">📥 Exportar Backup (JSON)</button>
        <button class="btn-secondary" onclick="exportCSV()">📊 Exportar CSV</button>
        <input type="file" id="import-file" style="display:none" onchange="importBackup(event)">
        <button class="btn-secondary" onclick="document.getElementById('import-file').click()">📤 Importar Backup</button>
      </div>
    </section>

    <!-- BUSCA GLOBAL RESULTADOS -->
    <section id="sec-search" class="view-section">
      <h2>Resultados da Busca</h2>
      <div id="search-results" class="card-list"></div>
    </section>
  </main>

  <!-- NAVEGAÇÃO MOBILE INFERIOR -->
  <nav class="bottom-nav">
    <button onclick="navTo('sec-dashboard')" class="nav-item active">🏠 Início</button>
    <button onclick="navTo('sec-clientes')" class="nav-item">👤 Clientes</button>
    <button onclick="navTo('sec-motos')" class="nav-item">🏍️ Motos</button>
    <button onclick="navTo('sec-retornos')" class="nav-item">🔔 Retornos</button>
    <button onclick="navTo('sec-menu')" class="nav-item">⚙️ Menu</button>
  </nav>

  <!-- MODAL CLIENTE -->
  <div id="modal-cliente" class="modal">
    <div class="modal-content">
      <h3>Novo Cliente</h3>
      <form id="form-cliente" onsubmit="saveCliente(event)">
        <input type="text" id="cli_NOME" placeholder="Nome completo" required>
        <input type="text" id="cli_CPF_CNPJ" placeholder="CPF/CNPJ">
        <input type="tel" id="cli_TELEFONE" placeholder="Telefone">
        <input type="tel" id="cli_WHATSAPP" placeholder="WhatsApp (ex: 5511999999999)">
        <input type="email" id="cli_EMAIL" placeholder="E-mail">
        <input type="text" id="cli_CEP" placeholder="CEP">
        <input type="text" id="cli_ENDERECO" placeholder="Endereço">
        <input type="text" id="cli_NUMERO" placeholder="Número">
        <input type="text" id="cli_BAIRRO" placeholder="Bairro">
        <input type="text" id="cli_CIDADE" placeholder="Cidade">
        <input type="text" id="cli_UF" placeholder="UF" maxlength="2">
        <textarea id="cli_OBSERVACOES" placeholder="Observações"></textarea>
        
        <button type="submit" class="btn-primary">Salvar Cliente</button>
        <button type="reset" class="btn-secondary">🧹 Limpar Campos</button>
        <button type="button" class="btn-danger" onclick="closeModal('modal-cliente')">Cancelar</button>
      </form>
    </div>
  </div>

  <!-- MODAL MOTO -->
  <div id="modal-moto" class="modal">
    <div class="modal-content">
      <h3>Nova Moto</h3>
      <form id="form-moto" onsubmit="saveMoto(event)">
        <select id="moto_ID_CLIENTE" required>
          <option value="">Selecione o Cliente</option>
        </select>
        <input type="text" id="moto_MARCA" placeholder="Marca (ex: Honda)">
        <input type="text" id="moto_MODELO" placeholder="Modelo (ex: CG 160)">
        <input type="number" id="moto_ANO" placeholder="Ano">
        <input type="text" id="moto_COR" placeholder="Cor">
        <input type="text" id="moto_PLACA" placeholder="Placa">
        <input type="text" id="moto_CHASSI" placeholder="Chassi">
        <input type="text" id="moto_RENAVAM" placeholder="Renavam">
        <input type="number" id="moto_KM_ATUAL" placeholder="KM Atual">
        <textarea id="moto_OBSERVACOES" placeholder="Observações"></textarea>
        
        <button type="submit" class="btn-primary">Salvar Moto</button>
        <button type="reset" class="btn-secondary">🧹 Limpar Campos</button>
        <button type="button" class="btn-danger" onclick="closeModal('modal-moto')">Cancelar</button>
      </form>
    </div>
  </div>

  <!-- MODAL MANUTENÇÃO -->
  <div id="modal-manutencao" class="modal">
    <div class="modal-content">
      <h3>Nova Manutenção</h3>
      <form id="form-manutencao" onsubmit="saveManutencao(event)">
        <input type="hidden" id="man_ID_CLIENTE">
        <input type="hidden" id="man_ID_MOTO">
        
        <p><strong id="man_info_moto"></strong></p>
        
        <label for="man_SERVICO"><strong>Serviço Realizado:</strong></label>
        <select id="man_SERVICO" onchange="onServiceSelect(this.value)" required>
          <option value="">Carregando serviços...</option>
        </select>

        <label for="man_TIPO_MANUTENCAO"><strong>Tipo de Manutenção:</strong></label>
        <select id="man_TIPO_MANUTENCAO">
          <option value="Preventiva">Preventiva</option>
          <option value="Corretiva">Corretiva</option>
        </select>

        <input type="number" id="man_KM_SERVICO" placeholder="KM Atual do Serviço">
        <input type="number" step="0.01" id="man_VALOR" placeholder="Valor (R$)">
        <input type="text" id="man_PECAS_UTILIZADAS" placeholder="Peças Utilizadas">
        <input type="text" id="man_MECANICO" placeholder="Mecânico responsável">
        <textarea id="man_OBSERVACOES" placeholder="Observações"></textarea>
        
        <hr>
        <h4>Sugestão de Retorno</h4>
        <label for="man_PROXIMA_DATA_SUGERIDA">Próxima Data Sugerida:</label>
        <input type="date" id="man_PROXIMA_DATA_SUGERIDA">
        <label for="man_PROXIMA_KM_SUGERIDA">Próxima KM Sugerida:</label>
        <input type="number" id="man_PROXIMA_KM_SUGERIDA">

        <button type="submit" class="btn-primary">Confirmar e Salvar</button>
        <button type="reset" class="btn-secondary">🧹 Limpar Campos</button>
        <button type="button" class="btn-danger" onclick="closeModal('modal-manutencao')">Cancelar</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
