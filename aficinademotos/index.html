<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador do Sistema</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container">
    <header class="app-header">
      <h1>Painel de Controle</h1>
    </header>

    <!-- PAINEL PRINCIPAL DE BOTOES ELEGANTES PARA CELULAR -->
    <section class="action-buttons-grid">
      <!-- Botão para abrir o Modal de Consultas da API -->
      <button type="button" class="btn-elegant" onclick="openModal('modal-api-get')">
        <span class="btn-icon">⚡</span>
        <span class="btn-text">Consultas da API (GET)</span>
      </button>

      <!-- Botão Cadastrados / Novo Cliente (Interligados) -->
      <button type="button" class="btn-elegant btn-primary-custom" onclick="openModal('modal-clientes')">
        <span class="btn-icon">👥</span>
        <span class="btn-text">Cadastrados / Novo Cliente</span>
      </button>
    </section>
  </main>


  <!-- ========================================== -->
  <!-- MODAL 1: CONSULTAS DA API (GET) + TERMINAL -->
  <!-- ========================================== -->
  <div id="modal-api-get" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Consultas da API (GET)</h2>
        <button type="button" class="close-btn" onclick="closeModal('modal-api-get')">&times;</button>
      </div>
      
      <div class="modal-body">
        <!-- As 4 Opções de Consulta -->
        <div class="api-options-grid">
          <button type="button" class="btn-api-opt" onclick="executarConsultaGET(1)">1. Listar Clientes</button>
          <button type="button" class="btn-api-opt" onclick="executarConsultaGET(2)">2. Listar Ordens de Serviço</button>
          <button type="button" class="btn-api-opt" onclick="executarConsultaGET(3)">3. Status dos Serviços</button>
          <button type="button" class="btn-api-opt" onclick="executarConsultaGET(4)">4. Logs do Sistema</button>
        </div>

        <!-- Terminal de Saída de Dados -->
        <div class="terminal-container">
          <div class="terminal-header">
            <span>Terminal de Saída (JSON)</span>
            <button type="button" class="btn-copy" onclick="copiarTerminal()">Copiar</button>
          </div>
          <pre id="api-terminal-output">// Selecione uma opção acima para exibir o retorno da API...</pre>
        </div>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- MODAL 2: CADASTRADOS E NOVO CLIENTE        -->
  <!-- ========================================== -->
  <div id="modal-clientes" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Clientes Cadastrados</h2>
        <button type="button" class="close-btn" onclick="closeModal('modal-clientes')">&times;</button>
      </div>

      <div class="modal-body">
        <!-- Alternar entre Lista de Cadastrados e Novo Cadastro -->
        <div class="tabs-container">
          <button type="button" class="tab-btn active" id="tab-btn-lista" onclick="alternarAbaClientes('lista')">Lista de Clientes</button>
          <button type="button" class="tab-btn" id="tab-btn-novo" onclick="alternarAbaClientes('novo')">+ Novo Cliente</button>
        </div>

        <!-- Conteúdo da Aba 1: Lista de Clientes -->
        <div id="aba-lista-clientes" class="tab-content active">
          <div class="clientes-list" id="container-lista-clientes">
            <!-- Renderizado Dinamicamente via JS -->
          </div>
        </div>

        <!-- Conteúdo da Aba 2: Novo Cliente -->
        <div id="aba-novo-cliente" class="tab-content">
          <form id="form-novo-cliente" onsubmit="salvarNovoCliente(event)">
            <div class="form-group">
              <label for="novo-nome">Nome do Cliente:</label>
              <input type="text" id="novo-nome" class="form-input" placeholder="Ex: Maria Oliveira" required>
            </div>
            <div class="form-group">
              <label for="novo-telefone">Telefone / WhatsApp:</label>
              <input type="tel" id="novo-telefone" class="form-input" placeholder="(00) 00000-0000">
            </div>
            <button type="submit" class="btn-elegant btn-success">Salvar Cadastro</button>
          </form>
        </div>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- MODAL 3: GERENCIAR ORDEM DE SERVIÇO (OS)   -->
  <!-- ========================================== -->
  <div id="modal-os" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Gerenciar Ordem de Serviço</h2>
        <button type="button" class="close-btn" onclick="closeModal('modal-os')">&times;</button>
      </div>

      <div class="modal-body">
        <!-- Cartão Informativo: Nome do Cliente + CLI-ID -->
        <div class="client-info-card">
          <div class="info-group">
            <span class="info-label">Cliente:</span>
            <span id="os-cliente-nome" class="info-value-bold">--</span>
          </div>
          <div class="info-group">
            <span class="info-label">CLI-ID:</span>
            <span id="os-cliente-id" class="badge-cli-id">CLI-0000</span>
          </div>
        </div>

        <!-- Formulário da Ordem de Serviço -->
        <form id="form-os" onsubmit="salvarOrdemServico(event)">
          <div class="form-group">
            <label for="os-descricao">Descrição do Serviço:</label>
            <textarea id="os-descricao" class="form-input" rows="4" placeholder="Descreva o problema ou a manutenção necessária..." required></textarea>
          </div>

          <div class="form-group">
            <label for="os-status">Status Inicial:</label>
            <select id="os-status" class="form-input">
              <option value="Aberto">Aberto</option>
              <option value="Em Andamento">Em Andamento</option>
              <option value="Aguardando Peça">Aguardando Peça</option>
              <option value="Concluído">Concluído</option>
            </select>
          </div>

          <button type="submit" class="btn-elegant btn-primary-custom">Criar Ordem de Serviço</button>
        </form>
      </div>
    </div>
  </div>


  <!-- ========================================== -->
  <!-- LÓGICA JAVASCRIPT                          -->
  <!-- ========================================== -->
  <script>
    // Base de dados simulada para testes
    let clientesCadastrados = [
      { id: 'CLI-0042', nome: 'João Silva', telefone: '(11) 98765-4321' },
      { id: 'CLI-0043', nome: 'Maria Oliveira', telefone: '(21) 99887-6655' },
      { id: 'CLI-0044', nome: 'Carlos Eduardo', telefone: '(31) 97123-4455' }
    ];

    // --- CONTROLE DOS MODAIS ---
    function openModal(modalId) {
      document.getElementById(modalId).classList.add('active');
      if (modalId === 'modal-clientes') {
        renderizarListaClientes();
      }
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('active');
    }

    // Fechar ao clicar fora do conteúdo
    window.onclick = function(event) {
      if (event.target.classList.contains('modal')) {
        event.target.classList.remove('active');
      }
    };

    // --- CONSULTAS DA API (GET) + TERMINAL ---
    function executarConsultaGET(opcao) {
      const output = document.getElementById('api-terminal-output');
      output.innerText = `[GET] Enviando requisição para opção ${opcao}...`;

      // Simulação de resposta da API
      setTimeout(() => {
        let dados;
        switch(opcao) {
          case 1:
            dados = { status: 200, endpoint: "/api/v1/clientes", total: clientesCadastrados.length, data: clientesCadastrados };
            break;
          case 2:
            dados = { status: 200, endpoint: "/api/v1/ordens-servico", total: 1, data: [{ os_id: "OS-1001", cli_id: "CLI-0042", status: "Em Andamento" }] };
            break;
          case 3:
            dados = { status: 200, endpoint: "/api/v1/servicos/status", servidor: "Online", conexao_db: "OK" };
            break;
          case 4:
            dados = { status: 200, endpoint: "/api/v1/logs", logs: ["10:00 - GET /clientes 200 OK", "10:02 - POST /os 201 Created"] };
            break;
        }
        output.innerText = JSON.stringify(dados, null, 2);
      }, 400);
    }

    function copiarTerminal() {
      const texto = document.getElementById('api-terminal-output').innerText;
      navigator.clipboard.writeText(texto).then(() => {
        alert("Conteúdo do terminal copiado!");
      });
    }

    // --- CADASTRADOS / NOVO CLIENTE ---
    function alternarAbaClientes(aba) {
      const tabLista = document.getElementById('tab-btn-lista');
      const tabNovo = document.getElementById('tab-btn-novo');
      const conteudoLista = document.getElementById('aba-lista-clientes');
      const conteudoNovo = document.getElementById('aba-novo-cliente');

      if (aba === 'lista') {
        tabLista.classList.add('active');
        tabNovo.classList.remove('active');
        conteudoLista.classList.add('active');
        conteudoNovo.classList.remove('active');
      } else {
        tabNovo.classList.add('active');
        tabLista.classList.remove('active');
        conteudoNovo.classList.add('active');
        conteudoLista.classList.remove('active');
      }
    }

    function renderizarListaClientes() {
      const container = document.getElementById('container-lista-clientes');
      container.innerHTML = '';

      if (clientesCadastrados.length === 0) {
        container.innerHTML = '<p class="empty-msg">Nenhum cliente cadastrado.</p>';
        return;
      }

      clientesCadastrados.forEach(cliente => {
        const item = document.createElement('div');
        item.className = 'cliente-item';
        item.innerHTML = `
          <div class="cliente-item-info">
            <strong>${cliente.nome}</strong>
            <span class="badge-cli-id-sm">${cliente.id}</span>
          </div>
          <button type="button" class="btn-action-sm" onclick="abrirGerenciadorOS('${cliente.nome}', '${cliente.id}')">
            Abrir OS
          </button>
        `;
        container.appendChild(item);
      });
    }

    function salvarNovoCliente(e) {
      e.preventDefault();
      const nome = document.getElementById('novo-nome').value;
      const telefone = document.getElementById('novo-telefone').value;
      
      const novoId = `CLI-00${clientesCadastrados.length + 43}`;
      
      const novoCliente = { id: novoId, nome: nome, telefone: telefone };
      clientesCadastrados.push(novoCliente);

      document.getElementById('form-novo-cliente').reset();
      renderizarListaClientes();
      alternarAbaClientes('lista');
    }

    // --- GERENCIAR ORDEM DE SERVIÇO (OS) ---
    function abrirGerenciadorOS(nomeCliente, idCliente) {
      closeModal('modal-clientes');
      document.getElementById('os-cliente-nome').innerText = nomeCliente;
      document.getElementById('os-cliente-id').innerText = idCliente;
      openModal('modal-os');
    }

    function salvarOrdemServico(e) {
      e.preventDefault();
      const cliId = document.getElementById('os-cliente-id').innerText;
      const descricao = document.getElementById('os-descricao').value;
      const status = document.getElementById('os-status').value;

      alert(`Ordem de serviço criada com sucesso!\nCliente: ${cliId}\nStatus: ${status}`);
      document.getElementById('form-os').reset();
      closeModal('modal-os');
    }
  </script>
</body>
</html>
