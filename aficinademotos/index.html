<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão de Oficina - Moto Precision</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="app-header">
    <div class="logo-container">
      <div class="logo-icon">🛠️</div>
      <h1>Moto Precision <span class="badge">PRO</span></h1>
    </div>
    <div class="header-actions">
      <button class="btn btn-secondary" onclick="openModal('modalCliente')">+ Cliente</button>
      <button class="btn btn-secondary" onclick="openModal('modalMoto')">+ Moto</button>
      <button class="btn btn-primary" onclick="openModal('modalOS')">+ Nova O.S.</button>
    </div>
  </header>

  <main class="container">
    <!-- Painel de Ações e Testes -->
    <section class="card">
      <h2>Painel de Controle & Consultas API</h2>
      <p class="subtitle">Clique nos botões abaixo para testar a comunicação em tempo real com a planilha Google Sheets.</p>
      
      <div class="button-group">
        <button id="btnPing" class="btn btn-outline">Testar Conexão (Ping)</button>
        <button id="btnClientes" class="btn btn-outline">Listar Clientes</button>
        <button id="btnMotos" class="btn btn-outline">Listar Motos</button>
        <button id="btnServicos" class="btn btn-outline">Listar Serviços</button>
      </div>

      <div class="console-box">
        <div class="console-header">
          <span>Console de Resposta da API</span>
          <span class="status-indicator"></span>
        </div>
        <pre id="output">Aguardando ação...</pre>
      </div>
    </section>
  </main>

  <!-- MÓDULO 1: MODAL NOVO CLIENTE -->
  <div class="modal-overlay" id="modalCliente">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Cadastrar Novo Cliente</h3>
        <button class="close-modal" onclick="closeModal('modalCliente')">&times;</button>
      </div>
      <form id="formCliente">
        <input type="text" id="nomeCliente" placeholder="Nome Completo *" required>
        <input type="text" id="cpfCliente" placeholder="CPF / CNPJ">
        <input type="tel" id="telCliente" placeholder="Telefone / WhatsApp *" required>
        <input type="email" id="emailCliente" placeholder="E-mail">
        <button type="submit" class="btn btn-primary">Salvar Cliente na Planilha</button>
      </form>
    </div>
  </div>

  <!-- MÓDULO 2: MODAL NOVA MOTO -->
  <div class="modal-overlay" id="modalMoto">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Cadastrar Moto</h3>
        <button class="close-modal" onclick="closeModal('modalMoto')">&times;</button>
      </div>
      <form id="formMoto">
        <select id="idClienteMoto" required style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-color, #ffffff); padding: 12px; border-radius: 8px; outline: none; font-size: 0.9rem;">
          <option value="">Carregando clientes...</option>
        </select>
        <input type="text" id="marcaMoto" placeholder="Marca (ex: Honda) *" required>
        <input type="text" id="modeloMoto" placeholder="Modelo (ex: CG 160) *" required>
        <input type="text" id="placaMoto" placeholder="Placa *" required>
        <input type="number" id="kmMoto" placeholder="KM Atual">
        <button type="submit" class="btn btn-primary">Salvar Moto na Planilha</button>
      </form>
    </div>
  </div>

  <!-- MÓDULO 3: MODAL NOVA ORDEM DE SERVIÇO (O.S.) -->
  <div class="modal-overlay" id="modalOS">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Abertura de Ordem de Serviço</h3>
        <button class="close-modal" onclick="closeModal('modalOS')">&times;</button>
      </div>
      <form id="formOS">
        <select id="idClienteOS" required style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-color, #ffffff); padding: 12px; border-radius: 8px; outline: none; font-size: 0.9rem;">
          <option value="">Selecione o Cliente *</option>
        </select>
        <select id="idMotoOS" required style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-color, #ffffff); padding: 12px; border-radius: 8px; outline: none; font-size: 0.9rem;">
          <option value="">Selecione primeiro o cliente...</option>
        </select>
        <textarea id="defeitoOS" placeholder="Descrição do Defeito / Solicitação *" rows="3" required style="background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: var(--text-color, #ffffff); padding: 12px; border-radius: 8px; outline: none; font-size: 0.9rem; resize: vertical;"></textarea>
        <button type="submit" class="btn btn-primary">Gerar Ordem de Serviço</button>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
