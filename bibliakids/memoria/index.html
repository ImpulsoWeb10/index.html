<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memória Bíblica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<style>
  :root{
    --purple-deep:#2E2159; --purple:#4C3A8A; --purple-light:#6C57B8;
    --yellow:#FFD84D; --yellow-dark:#E0A800;
    --blue:#2E86F0; --coral:#FF6F59; --cream:#FFF8E7;
    --ink:#2B2447; --ink-soft:#5B547E; --green:#3FBE7A;
    --radius-lg:22px; --radius-md:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Nunito',sans-serif; color:var(--ink);
    background:
      radial-gradient(circle at 15% 10%, rgba(255,216,77,0.12), transparent 40%),
      radial-gradient(circle at 85% 20%, rgba(255,111,89,0.10), transparent 45%),
      linear-gradient(180deg, var(--purple-deep), var(--purple) 60%, var(--purple-light));
    min-height:100vh; padding:24px 16px 60px;
  }
  .stars-bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .stars-bg span{position:absolute;color:var(--yellow);opacity:.55;font-size:14px;animation:twinkle 3s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.8);}50%{opacity:.7;transform:scale(1.15);}}

  .wrap{max-width:900px;margin:0 auto;position:relative;z-index:1;}
  header{text-align:center;margin-bottom:26px;}
  .logo-badge{
    display:inline-block;background:linear-gradient(180deg,var(--purple-light),var(--purple));
    border:4px solid var(--yellow);border-radius:26px;padding:14px 34px;
    box-shadow:0 8px 0 rgba(0,0,0,0.22);
  }
  h1{
    font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(28px,6vw,44px);margin:0;
    color:var(--yellow);-webkit-text-stroke:2px var(--purple-deep);
    text-shadow:0 4px 0 rgba(0,0,0,0.25);letter-spacing:1px;
  }
  header p{color:var(--cream);font-size:14px;margin:10px 0 0;opacity:.85;}

  .step-title{
    font-family:'Baloo 2';font-weight:800;font-size:20px;color:var(--cream);
    text-align:center;margin:0 0 18px;
  }

  .theme-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;
  }
  .theme-opt{
    position:relative;border:none;border-radius:18px;padding:20px 12px;
    display:flex;flex-direction:column;align-items:center;gap:10px;
    cursor:pointer;font-family:'Baloo 2';font-weight:700;font-size:14px;color:#fff;
    box-shadow:0 6px 0 rgba(0,0,0,0.2);transition:transform .12s ease;
  }
  .theme-opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,0.2);}
  .theme-opt i{font-size:30px;}
  .theme-opt .badge-verso{
    position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.25);
    border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
  }
  .theme-opt .badge-verso i{font-size:12px;}

  .level-list{display:flex;flex-direction:column;gap:12px;max-width:460px;margin:0 auto;}
  .level-opt{
    border:none;border-radius:16px;padding:18px 20px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    cursor:pointer;background:var(--cream);box-shadow:0 5px 0 rgba(0,0,0,0.18);
    text-align:left;transition:transform .12s ease;
  }
  .level-opt:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,0.18);}
  .level-opt .lv-name{font-family:'Baloo 2';font-weight:800;font-size:18px;color:var(--purple);}
  .level-opt .lv-desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .level-opt .lv-stars i{color:var(--yellow-dark);font-size:17px;}

  .btn-voltar{
    display:inline-flex;align-items:center;gap:6px;
    background:none;border:none;color:var(--cream);font-family:'Baloo 2';font-weight:700;
    font-size:14px;cursor:pointer;margin-bottom:18px;opacity:.85;
  }
  .btn-voltar:hover{opacity:1;}

  .tema-atual-badge{
    display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:22px;
  }
  .tema-atual-badge .icone{
    width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 0 rgba(0,0,0,0.18);
  }
  .tema-atual-badge .icone i{color:#fff;font-size:22px;}
  .tema-atual-badge span{font-family:'Baloo 2';font-weight:800;font-size:20px;color:var(--cream);}

  footer{text-align:center;color:rgba(255,255,255,0.55);font-size:12px;margin-top:34px;}

  #stepLevels{display:none;}
</style>
</head>
<body>

<div class="stars-bg" id="starsBg"></div>

<div class="wrap">
  <header>
    <div class="logo-badge"><h1>Memória Bíblica</h1></div>
    <p>Escolha um tema para jogar</p>
  </header>

  <div id="stepThemes">
    <p class="step-title">Escolha o tema</p>
    <div class="theme-grid" id="themeGrid"></div>
  </div>

  <div id="stepLevels">
    <button class="btn-voltar" id="btnVoltar"><i class="ti ti-arrow-left"></i> Escolher outro tema</button>
    <div class="tema-atual-badge">
      <div class="icone" id="temaIcone"><i class="ti ti-book"></i></div>
      <span id="temaNome">Tema</span>
    </div>
    <p class="step-title">Escolha o nível</p>
    <div class="level-list" id="levelList"></div>
  </div>

  <footer>Feito com carinho para pequenos aprendizes • ImpulsoWeb10</footer>
</div>

<script>
const THEMES = [
  {slug:'historias',   nome:'Histórias Bíblicas', icon:'ti-book-2',           c1:'#8B5CF6', c2:'#5B3FA8', versiculos:true},
  {slug:'criacao',     nome:'Criação',            icon:'ti-world',           c1:'#63A653', c2:'#3B7A2E', versiculos:true},
  {slug:'coragem',     nome:'Coragem',            icon:'ti-shield-check',    c1:'#2E86F0', c2:'#1B5FB0'},
  {slug:'fe',          nome:'Fé',                 icon:'ti-star',            c1:'#FFB020', c2:'#C97C00'},
  {slug:'esperanca',   nome:'Esperança',          icon:'ti-rainbow',         c1:'#3FBE7A', c2:'#1F8A54'},
  {slug:'amor',        nome:'Amor',               icon:'ti-heart',           c1:'#F0568A', c2:'#B92E62'},
  {slug:'perdao',      nome:'Perdão',             icon:'ti-heart-handshake',c1:'#9B6BD6', c2:'#6B3FA8'},
  {slug:'obediencia',  nome:'Obediência',         icon:'ti-checkbox',        c1:'#4C3A8A', c2:'#2E2159'},
  {slug:'sabedoria',   nome:'Sabedoria',          icon:'ti-bulb',            c1:'#FF6F59', c2:'#C7442F'},
  {slug:'milagres',    nome:'Milagres',           icon:'ti-sparkles',        c1:'#2EC4C4', c2:'#0F8A8A'},
  {slug:'amizade',     nome:'Amizade',            icon:'ti-users',           c1:'#E0A800', c2:'#A87A00'},
];

const LEVELS = [
  {id:'facil',   nome:'Fácil',   pares:5,  stars:1, desc:'5 imagens (10 cartinhas)'},
  {id:'medio',   nome:'Médio',   pares:10, stars:2, desc:'10 imagens (20 cartinhas)'},
  {id:'dificil', nome:'Difícil', pares:15, stars:3, desc:'15 imagens (30 cartinhas)'},
];

let temaSelecionado = null;

function buildStarsBg(){
  const el = document.getElementById('starsBg');
  let html='';
  for(let i=0;i<24;i++){
    const left = Math.random()*100, top = Math.random()*100, delay = Math.random()*3;
    html += `<span style="left:${left}%;top:${top}%;animation-delay:${delay}s;">✦</span>`;
  }
  el.innerHTML = html;
}

function buildThemeGrid(){
  const grid = document.getElementById('themeGrid');
  grid.innerHTML = THEMES.map(t => `
    <button class="theme-opt" data-slug="${t.slug}" style="background:linear-gradient(160deg,${t.c1},${t.c2});">
      ${t.versiculos ? '<span class="badge-verso"><i class="ti ti-quote"></i></span>' : ''}
      <i class="ti ${t.icon}"></i>${t.nome}
    </button>`).join('');
  grid.querySelectorAll('.theme-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      temaSelecionado = THEMES.find(t=>t.slug===btn.dataset.slug);
      mostrarNiveis();
    });
  });
}

function buildLevelList(){
  const list = document.getElementById('levelList');
  list.innerHTML = LEVELS.map(l => `
    <button class="level-opt" data-id="${l.id}">
      <div>
        <div class="lv-name">${l.nome}</div>
        <div class="lv-desc">${l.desc}</div>
      </div>
      <div class="lv-stars">${'<i class="ti ti-star-filled"></i>'.repeat(l.stars)}</div>
    </button>`).join('');
  list.querySelectorAll('.level-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const nivel = LEVELS.find(l=>l.id===btn.dataset.id);
      irParaJogo(temaSelecionado, nivel);
    });
  });
}

function mostrarNiveis(){
  document.getElementById('stepThemes').style.display = 'none';
  document.getElementById('stepLevels').style.display = 'block';
  document.getElementById('temaNome').textContent = temaSelecionado.nome;
  document.getElementById('temaIcone').style.background =
    `linear-gradient(160deg,${temaSelecionado.c1},${temaSelecionado.c2})`;
  document.getElementById('temaIcone').innerHTML = `<i class="ti ${temaSelecionado.icon}"></i>`;
  buildLevelList();
}

function irParaJogo(tema, nivel){
  const params = new URLSearchParams({
    tema: tema.slug,
    nivel: nivel.id,
    nome: tema.nome,
    icon: tema.icon,
    c1: tema.c1,
    c2: tema.c2,
  });
  window.location.href = `jogo.html?${params.toString()}`;
}

document.getElementById('btnVoltar').addEventListener('click', ()=>{
  document.getElementById('stepLevels').style.display = 'none';
  document.getElementById('stepThemes').style.display = 'block';
});

buildStarsBg();
buildThemeGrid();
</script>
</body>
</html>
