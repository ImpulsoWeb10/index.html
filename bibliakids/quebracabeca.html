<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Quebra-Cabeça da Arca de Noé</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e0f2fe;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100vh;
      overflow: hidden;
      color: #0c4a6e;
    }

    header {
      width: 100%;
      padding: 8px 12px;
      text-align: center;
      background-color: #38bdf8;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }

    h1 {
      font-size: 1.1rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      gap: 5px;
    }

    .counter {
      font-size: 0.85rem;
      font-weight: bold;
      background: #ffffff;
      padding: 5px 8px;
      border-radius: 12px;
      color: #0284c7;
      white-space: nowrap;
    }

    .btn {
      background-color: #facc15;
      color: #713f12;
      border: none;
      padding: 6px 10px;
      font-size: 0.8rem;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 3px 0 #ca8a04;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #ca8a04;
    }

    .btn-model {
      background-color: #4ade80;
      color: #14532d;
      box-shadow: 0 3px 0 #16a34a;
    }

    .btn-model:active {
      box-shadow: 0 1px 0 #16a34a;
    }

    #game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      flex: 1;
      padding-top: 5px;
    }

    /* Tabuleiro posicionado mais para cima */
    #board {
      width: 280px;
      height: 336px;
      background-color: #ffffff;
      border: 4px solid #0284c7;
      border-radius: 12px;
      position: relative;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .slot {
      position: absolute;
      box-sizing: border-box;
      border: 1px dashed #bae6fd;
    }

    .piece {
      position: absolute;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 3px 6px rgba(0,0,0,0.25);
      border-radius: 4px;
      z-index: 10;
      cursor: grab;
      background-repeat: no-repeat;
    }

    .piece.placed {
      border: none;
      box-shadow: none;
      z-index: 1;
      cursor: default;
    }

    /* Bandeja inferior maior para caber bem as peças */
    #tray {
      width: 100vw;
      height: 35vh;
      background-color: #bae6fd;
      border-top: 4px solid #38bdf8;
      position: relative;
      overflow: hidden;
    }

    /* Modais */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 4px solid #facc15;
      max-width: 85%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .modal-card h2 {
      color: #0284c7;
      font-size: 1.4rem;
    }

    .modal-card p {
      font-size: 1rem;
      color: #334155;
      font-weight: bold;
    }

    /* Imagem modelo com metade do tamanho da original */
    .model-img {
      width: 140px;
      height: 168px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #0284c7;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <header>
    <h1>🚢 Quebra-Cabeça da Arca</h1>
    <div class="controls">
      <div class="counter">Movs: <span id="moves-count">0</span></div>
      <button class="btn btn-model" id="model-btn">Imagem Modelo</button>
      <button class="btn" id="restart-btn">Embaralhar</button>
    </div>
  </header>

  <div id="game-container">
    <div id="board"></div>
  </div>

  <div id="tray"></div>

  <!-- Modal Imagem Modelo -->
  <div class="modal" id="image-modal">
    <div class="modal-card">
      <img src="noe.jpg" alt="Modelo da Arca" class="model-img">
      <p>Vamos lá amiguinhos, montar esse animado quebra-cabeça!</p>
      <button class="btn" id="close-model-btn">Fechar</button>
    </div>
  </div>

  <!-- Modal Vitória -->
  <div class="modal" id="win-modal">
    <div class="modal-card">
      <h2>🎉 Parabéns!</h2>
      <p>Você completou o quebra-cabeça!</p>
      <button class="btn" id="modal-restart-btn">Jogar Novamente</button>
    </div>
  </div>

  <script>
    const COLS = 5;
    const ROWS = 6;
    const TOTAL_PIECES = COLS * ROWS;
    const IMAGE_SRC = 'noe.jpg';

    const board = document.getElementById('board');
    const tray = document.getElementById('tray');
    const movesDisplay = document.getElementById('moves-count');
    const restartBtn = document.getElementById('restart-btn');
    const modelBtn = document.getElementById('model-btn');
    const closeModelBtn = document.getElementById('close-model-btn');
    const modalRestartBtn = document.getElementById('modal-restart-btn');
    const winModal = document.getElementById('win-modal');
    const imageModal = document.getElementById('image-modal');

    let pieceWidth, pieceHeight;
    let placedCount = 0;
    let movesCount = 0;

    const img = new Image();
    img.src = IMAGE_SRC;
    img.onload = () => {
      setupDimensions();
      initGame();
    };
    img.onerror = () => {
      setupDimensions();
      initGame();
    };

    function setupDimensions() {
      const boardWidth = board.clientWidth;
      const boardHeight = board.clientHeight;

      pieceWidth = boardWidth / COLS;
      pieceHeight = boardHeight / ROWS;
    }

    function initGame() {
      board.innerHTML = '';
      tray.innerHTML = '';
      winModal.style.display = 'none';
      imageModal.style.display = 'none';
      placedCount = 0;
      movesCount = 0;
      movesDisplay.textContent = movesCount;

      const boardWidth = board.clientWidth;
      const boardHeight = board.clientHeight;

      const pieces = [];

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const slot = document.createElement('div');
          slot.classList.add('slot');
          slot.style.width = `${pieceWidth}px`;
          slot.style.height = `${pieceHeight}px`;
          slot.style.left = `${c * pieceWidth}px`;
          slot.style.top = `${r * pieceHeight}px`;
          board.appendChild(slot);

          const piece = document.createElement('div');
          piece.classList.add('piece');
          piece.style.width = `${pieceWidth}px`;
          piece.style.height = `${pieceHeight}px`;
          piece.style.backgroundImage = `url('${IMAGE_SRC}')`;
          piece.style.backgroundSize = `${boardWidth}px ${boardHeight}px`;
          piece.style.backgroundPosition = `-${c * pieceWidth}px -${r * pieceHeight}px`;

          piece.dataset.correctLeft = c * pieceWidth;
          piece.dataset.correctTop = r * pieceHeight;

          pieces.push(piece);
        }
      }

      pieces.sort(() => Math.random() - 0.5);

      pieces.forEach(piece => {
        const trayWidth = tray.clientWidth;
        const trayHeight = tray.clientHeight;

        const maxLeft = Math.max(0, trayWidth - pieceWidth);
        const maxTop = Math.max(0, trayHeight - pieceHeight);

        const randomLeft = Math.random() * maxLeft;
        const randomTop = Math.random() * maxTop;

        piece.style.left = `${randomLeft}px`;
        piece.style.top = `${randomTop}px`;

        tray.appendChild(piece);
        makeDraggable(piece);
      });
    }

    function makeDraggable(element) {
      let isDragging = false;
      let startX, startY;
      let initialLeft, initialTop;

      const onStart = (e) => {
        if (element.classList.contains('placed')) return;

        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        startX = clientX;
        startY = clientY;

        const rect = element.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        document.body.appendChild(element);
        element.style.left = `${initialLeft}px`;
        element.style.top = `${initialTop}px`;
        element.style.zIndex = '1000';
      };

      const onMove = (e) => {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const deltaX = clientX - startX;
        const deltaY = clientY - startY;

        element.style.left = `${initialLeft + deltaX}px`;
        element.style.top = `${initialTop + deltaY}px`;
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        element.style.zIndex = '10';

        movesCount++;
        movesDisplay.textContent = movesCount;

        const rect = element.getBoundingClientRect();
        const boardRect = board.getBoundingClientRect();

        const currentLeft = rect.left - boardRect.left;
        const currentTop = rect.top - boardRect.top;

        const targetLeft = parseFloat(element.dataset.correctLeft);
        const targetTop = parseFloat(element.dataset.correctTop);

        const tolerance = 25;

        if (
          Math.abs(currentLeft - targetLeft) < tolerance &&
          Math.abs(currentTop - targetTop) < tolerance
        ) {
          element.classList.add('placed');
          element.style.left = `${targetLeft}px`;
          element.style.top = `${targetTop}px`;
          board.appendChild(element);

          placedCount++;
          if (placedCount === TOTAL_PIECES) {
            setTimeout(() => {
              winModal.style.display = 'flex';
            }, 200);
          }
        } else {
          const trayRect = tray.getBoundingClientRect();
          if (
            rect.bottom < trayRect.top ||
            rect.top > trayRect.bottom ||
            rect.right < trayRect.left ||
            rect.left > trayRect.right
          ) {
            tray.appendChild(element);
            element.style.left = `${Math.random() * Math.max(0, tray.clientWidth - pieceWidth)}px`;
            element.style.top = `${Math.random() * Math.max(0, tray.clientHeight - pieceHeight)}px`;
          }
        }
      };

      element.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);

      element.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
    }

    modelBtn.addEventListener('click', () => {
      imageModal.style.display = 'flex';
    });

    closeModelBtn.addEventListener('click', () => {
      imageModal.style.display = 'none';
    });

    restartBtn.addEventListener('click', initGame);
    modalRestartBtn.addEventListener('click', initGame);
  </script>
</body>
</html>
