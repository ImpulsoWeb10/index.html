<style>
  :root {
    --neon-blue: #00d4ff;
    --gold: #FFC837;
    --bg-blue: #020611; /* Cor azul contínua de fundo */
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Nunito', sans-serif;
    background: var(--bg-blue);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto; /* Permite rolar e atualizar com puxão */
  }

  /* CONTAINER PROPORCIONAL À IMAGEM CAPA (843 x 1264) */
  .app-container {
    position: relative;
    width: 100vw;
    height: 100dvh;
    max-width: calc(100dvh * (843 / 1264));
    max-height: calc(100vw * (1264 / 843));
    background: url('capa.jpg') no-repeat top center;
    background-size: 100% 100%;
    box-shadow: 0 0 25px rgba(0,0,0,0.9);
    overflow: hidden;
    flex-shrink: 0;
  }

  /* ---------------------------------------------------
     BOTÕES SUPERIORES COM POSICIONAMENTO PRECISO
  --------------------------------------------------- */
  
  /* Botão Menu */
  .btn-menu-overlay {
    position: absolute;
    top: 2.5%;
    left: 4.2%;
    width: 12.5%;
    height: 6.2%;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
    z-index: 20;
  }

  /* Botão Perfil/Status */
  .btn-profile-overlay {
    position: absolute;
    top: 2.2%;
    right: 4.2%;
    width: 44%;
    height: 6.5%;
    border-radius: 30px;
    cursor: pointer;
    background: transparent;
    border: none;
    z-index: 20;
  }

  /* ---------------------------------------------------
     CARROSSEL DOS JOGOS
  --------------------------------------------------- */
  .carousel-wrapper {
    width: 100%;
    position: absolute;
    top: 65%; /* Posição ajustada logo abaixo da Bíblia */
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  .swipe-hint {
    font-size: clamp(0.65rem, 2.5vw, 0.75rem);
    color: #FFF;
    font-weight: 800;
    text-shadow: 0 2px 4px #000;
    margin-bottom: 4px;
    background: rgba(0, 0, 0, 0.65);
    padding: 2px 10px;
    border-radius: 12px;
  }

  .carousel-container {
    width: 100%;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 4px 16px;
    scrollbar-width: none;
  }
  .carousel-container::-webkit-scrollbar { display: none; }

  /* CARD INTERATIVO */
  .card-item {
    flex: 0 0 44%;
    max-width: 145px;
    background: rgba(2, 6, 17, 0.92);
    border: 2px solid var(--neon-blue);
    border-radius: 16px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .card-item:active { transform: scale(0.95); }

  .card-img-box {
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--neon-blue);
  }
  .card-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-title {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(0.75rem, 2.8vw, 0.85rem);
    font-weight: 800;
    color: #FFF;
    text-shadow: 0 0 6px var(--neon-blue);
    margin: 3px 0 2px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }

  .card-btn-action {
    background: linear-gradient(180deg, #00d4ff 0%, #005f73 100%);
    color: #FFF;
    border: none;
    border-radius: 10px;
    padding: 3px 6px;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(0.68rem, 2.6vw, 0.75rem);
    box-shadow: 0 0 6px var(--neon-blue);
    width: 100%;
  }

  /* ---------------------------------------------------
     BOTÕES INFERIORES
  --------------------------------------------------- */
  
  /* Botão Início (Casinha Amarela) */
  .btn-home-overlay {
    position: absolute;
    bottom: 3.5%;
    left: 18.5%;
    width: 18%;
    height: 8.5%;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
    z-index: 20;
  }

  /* Botão Configurações (Engrenagem Azul) */

    position: absolute;
    bottom: 3.5%;
    right: 18.5%;
    width: 18%;
    height: 8.5%;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
    z-index: 20;
  }

  .btn-menu-overlay:active,
  .btn-profile-overlay:active,
  .btn-home-overlay:active,
  .btn-config-overlay:active {
    background: rgba(255, 255, 255, 0.25);
  }

  /* ---------------------------------------------------

  --------------------------------------------------- */

    width: 100%;

    gap: 8px;
    font-size: 0.75rem;

  }

  .footer-bar svg {

  }

    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: color 0.2s ease;
  }

  .footer-bar a:hover {
    color: #FFC837;
    text-decoration: underline;
  }
</style>

<!-- SCRIPT DE MOVIMENTO AUTOMÁTICO DO CARROSSEL -->
<script>
  const container = document.getElementById('carousel');
  let autoScrollTimer = null;

  function startAutoScroll() {
    stopAutoScroll();
    autoScrollTimer = setInterval(() => {
      if (container.scrollLeft + container.clientWidth >= container.scrollWidth - 1) {
        container.scrollLeft = 0;
      } else {
        container.scrollLeft += 1; // Velocidade de rolagem suave
      }
    }, 25);
  }

  function stopAutoScroll() {
    if (autoScrollTimer) {
      clearInterval(autoScrollTimer);
      autoScrollTimer = null;
    }
  }

  // Inicia a movimentação automática
  startAutoScroll();

  // Pausa se o usuário interagir
  container.addEventListener('touchstart', stopAutoScroll, { passive: true });
  container.addEventListener('mousedown', stopAutoScroll);
</script>
