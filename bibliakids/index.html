<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quebra-Cabeça da Arca de Noé</title>
  <style>
    * {
      box-sizing: border-box;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #e0f2fe;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Fredoka', cursive, sans-serif;
      color: #0c4a6e;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      height: -webkit-fill-available;
      justify-content: space-between;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 6px 10px;
      text-align: center;
      background-color: #38bdf8;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      z-index: 10;
    }

    h1 {
      font-size: 1rem;
      color: #ffffff;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 360px;
      gap: 4px;
    }

    .btn {
      background-color: #facc15;
      color: #713f12;
      border: none;
      padding: 5px 8px;
      font-size: 0.75rem;
      font-weight: bold;
      border-radius: 10px;
      box-shadow: 0 2px 0 #ca8a04;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 0 0 #ca8a04;
    }

    .btn-select-img {
      background-color: #a855f7;
      color: #ffffff;
      box-shadow: 0 2px 0 #7e22ce;
    }

    .btn-select-img:active {
      box-shadow: 0 0 0 #7e22ce;
    }

    .btn-model {
      background-color: #4ade80;
      color: #14532d;
      box-shadow: 0 2px 0 #16a34a;
    }

    /* Painel de Botões na Vertical à Direita */
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
      justify-content: center;
    }

    .btn-side {
      padding: 8px 6px;
      border-radius: 10px;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      letter-spacing: 1px;
      font-size: 0.7rem;
    }

    .btn-easy {
      background-color: #4ade80;
      color: #14532d;
      box-shadow: -2px 2px 0 #16a34a;
    }

    .btn-medium {
      background-color: #facc15;
      color: #713f12;
      box-shadow: -2px 2px 0 #ca8a04;
    }

    .btn-hard {
      background-color: #fb923c;
      color: #7c2d12;
      box-shadow: -2px 2px 0 #ea580c;
    }

    .btn-back {
      background-color: #f87171;
      color: #7f1d1d;
      box-shadow: -2px 2px 0 #dc2626;
    }

    .btn-side:active {
      transform: translateX(2px);
      box-shadow: 0 0 0 transparent;
    }

    #game-container {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px 10px;
      gap: 8px;
    }

    #board {
      background-color: #ffffff;
      border: 3px solid #0284c7;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      overflow: hidden;
    }

    .slot {
      position: absolute;
      box-sizing: border-box;
      border: 1px dashed #bae6fd;
    }

    .piece {
      position: absolute;
      box-sizing: border-box;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 2px 5px rgba(0,0,0,0.25);
      border-radius: 4px;
      z-index: 10;
      cursor: grab;
      background-repeat: no-repeat;
    }

    .piece.placed {
      border: none;
      box-shadow: none;
      z-index: 1;
      cursor: default;
    }

    #tray {
      width: 100vw;
      height: 38vh;
      background-color: #bae6fd;
      border-top: 3px solid #38bdf8;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Contador na parte azul inferior (lado esquerdo) */
    .tray-counter {
      position: absolute;
      bottom: 8px;
      left: 10px;
      font-size: 0.8rem;
      font-weight: bold;
      background: #ffffff;
      padding: 4px 10px;
      border-radius: 12px;
      color: #0284c7;
      box-shadow: 0 2px 5px rgba(0,0,0,0.15);
      z-index: 50;
      pointer-events: none;
    }

    /* Modais */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 200;
      justify-content: center;
      align-items: center;
    }

    .modal-card {
      background: #ffffff;
      padding: 16px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      border: 3px solid #facc15;
      max-width: 90%;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      overflow-y: auto;
    }

    .modal-card h2 {
      color: #0284c7;
      font-size: 1.3rem;
    }

    .modal-card p {
      font-size: 0.95rem;
      color: #334155;
      font-weight: bold;
    }

    .model-img {
      max-width: 75vw;
      max-height: 55vh;
      object-fit: contain;
      border-radius: 8px;
      border: 3px solid #0284c7;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    /* Modal Escolha de Imagem */
    .image-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-height: 60vh;
      overflow-y: auto;
      padding: 4px;
    }

    .image-card {
      background: #f0f9ff;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      padding: 6px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .image-card:active {
      transform: scale(0.95);
    }

    .image-card.active {
      border-color: #a855f7;
      background-color: #f3e8ff;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.4);
    }

    .image-card img {
      width: 100%;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }

    .image-card span {
      font-size: 0.75rem;
      font-weight: bold;
      color: #0c4a6e;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <header>
      <h1>🚢 Quebra-Cabeça da Arca</h1>
      <div class="controls">
        <button class="btn btn-select-img" id="select-img-btn">Escolha Imagem</button>
        <button class="btn btn-model" id="model-btn">Imagem Modelo</button>
        <button class="btn" id="restart-btn">Embaralhar</button>
      </div>
    </header>

    <div id="game-container">
      <div id="board"></div>
      
      <div class="side-panel">
        <button class="btn btn-side btn-easy" id="easy-btn">FÁCIL (6)</button>
        <button class="btn btn-side btn-medium" id="medium-btn">MÉDIO (12)</button>
        <button class="btn btn-side btn-hard" id="hard-btn">DIFÍCIL (20)</button>
        <button class="btn btn-side btn-back" id="back-btn">VOLTAR</button>
      </div>
    </div>

    <div id="tray">
      <div class="tray-counter">Movs: <span id="moves-count">0</span></div>
    </div>
  </div>

  <!-- Modal Escolha de Imagem -->
  <div class="modal" id="select-modal">
    <div class="modal-card">
      <h2>🖼️ Escolha uma Imagem</h2>
      <div class="image-grid" id="image-grid"></div>
      <button class="btn" id="close-select-btn">Cancelar</button>
    </div>
  </div>

  <!-- Modal Imagem Modelo -->
  <div class="modal" id="image-modal">
    <div class="modal-card">
      <img src="noe.jpg" id="model-img-element" alt="Modelo da Arca" class="model-img">
      <p>Vamos lá amiguinhos, montar esse animado quebra-cabeça!</p>
      <button class="btn" id="close-model-btn">Fechar</button>
    </div>
  </div>

  <!-- Modal Trava de Mudança de Nível -->
  <div class="modal" id="lock-modal">
    <div class="modal-card">
      <h2>⚠️ Mudar de Nível</h2>
      <p>Você já está jogando um nível! Clique em <strong>VOLTAR</strong> para zerar as peças e escolher outro nível.</p>
      <button class="btn btn-back" id="lock-reset-btn" style="writing-mode: horizontal-tb; font-size: 0.9rem; padding: 8px 16px;">VOLTAR</button>
    </div>
  </div>

  <!-- Modal Vitória -->
  <div class="modal" id="win-modal">
    <div class="modal-card">
      <h2>🎉 Parabéns!</h2>
      <p>Você completou o quebra-cabeça!</p>
      <button class="btn" id="modal-restart-btn">Jogar Novamente</button>
    </div>
  </div>

  <script>
    // Lista das 5 imagens disponíveis
    const IMAGES = [
      { id: 'noe', src: 'noe.jpg', label: 'Noé 1' },
      { id: 'noe1', src: 'noe1.jpg', label: 'Noé 2' },
      { id: 'noe2', src: 'noe2.jpg', label: 'Noé 3' },
      { id: 'noe3', src: 'noe3.jpg', label: 'Noé 4' },
      { id: 'noe4', src: 'noe4.jpg', label: 'Noé 5' },
      { id: 'noe5', src: 'noe5.jpg', label: 'Noé 6' }
    ];

    let currentImageSrc = IMAGES[0].src;

    // Estado do jogo e Trava de Nível
    let currentLevel = null; // null | 'easy' | 'medium' | 'hard'
    let COLS = 4;
    let ROWS = 5;
    let TOTAL_PIECES = COLS * ROWS;

    const board = document.getElementById('board');
    const tray = document.getElementById('tray');
    const restartBtn = document.getElementById('restart-btn');
    const modelBtn = document.getElementById('model-btn');
    const selectImgBtn = document.getElementById('select-img-btn');
    const backBtn = document.getElementById('back-btn');
    const easyBtn = document.getElementById('easy-btn');
    const mediumBtn = document.getElementById('medium-btn');
    const hardBtn = document.getElementById('hard-btn');
    const closeModelBtn = document.getElementById('close-model-btn');
    const closeSelectBtn = document.getElementById('close-select-btn');
    const modalRestartBtn = document.getElementById('modal-restart-btn');
    const winModal = document.getElementById('win-modal');
    const imageModal = document.getElementById('image-modal');
    const selectModal = document.getElementById('select-modal');
    const lockModal = document.getElementById('lock-modal');
    const lockResetBtn = document.getElementById('lock-reset-btn');
    const imageGrid = document.getElementById('image-grid');
    const modelImgElement = document.getElementById('model-img-element');

    let pieceWidth, pieceHeight;
    let boardWidth, boardHeight;
    let placedCount = 0;
    let movesCount = 0;

    window.addEventListener('resize', () => {
      setupDimensions();
    });

    function renderImageOptions() {
      imageGrid.innerHTML = '';
      IMAGES.forEach(imgData => {
        const card = document.createElement('div');
        card.classList.add('image-card');
        if (imgData.src === currentImageSrc) {
          card.classList.add('active');
        }

        const imgEl = document.createElement('img');
        imgEl.src = imgData.src;
        imgEl.alt = imgData.label;
        imgEl.onerror = () => { imgEl.src = 'noe.jpg'; };

        const labelEl = document.createElement('span');
        labelEl.textContent = imgData.label;

        card.appendChild(imgEl);
        card.appendChild(labelEl);

        card.addEventListener('click', () => {
          currentImageSrc = imgData.src;
          modelImgElement.src = currentImageSrc;
          selectModal.style.display = 'none';
          clearAllPieces();
          setupGame();
        });

        imageGrid.appendChild(card);
      });
    }

    function setupDimensions() {
      const container = document.getElementById('game-container');
      const sidePanel = document.querySelector('.side-panel');
      const maxW = (container.clientWidth - sidePanel.clientWidth - 30) * 0.95;
      const maxH = container.clientHeight * 0.95;

      let width = maxW;
      let height = (width * ROWS) / COLS;

      if (height > maxH) {
        height = maxH;
        width = (height * COLS) / ROWS;
      }

      boardWidth = width;
      boardHeight = height;

      board.style.width = `${boardWidth}px`;
      board.style.height = `${boardHeight}px`;

      pieceWidth = boardWidth / COLS;
      pieceHeight = boardHeight / ROWS;
    }

    // Trava e Gerenciamento de Nível
    function handleLevelClick(levelName, cols, rows) {
      if (currentLevel !== null && currentLevel !== levelName) {
        lockModal.style.display = 'flex';
        return;
      }

      currentLevel = levelName;
      COLS = cols;
      ROWS = rows;
      TOTAL_PIECES = COLS * ROWS;
      setupGame();
    }

    // Zera o jogo completamente para trocar de nível sem acúmulo de imagens
    function resetAndClearGame() {
      currentLevel = null;
      clearAllPieces();
      board.innerHTML = '';
      movesCount = 0;
      placedCount = 0;
      const movesEl = document.getElementById('moves-count');
      if (movesEl) movesEl.textContent = '0';
      lockModal.style.display = 'none';
      winModal.style.display = 'none';
    }

    function clearAllPieces() {
      // Remove todas as peças soltas no body e containers
      document.querySelectorAll('.piece').forEach(p => p.remove());
    }

    function setupGame() {
      setupDimensions();
      initGame();
    }

    function initGame() {
      clearAllPieces();
      board.innerHTML = '';

      const existingCounter = tray.querySelector('.tray-counter');
      tray.innerHTML = '';
      if (existingCounter) {
        tray.appendChild(existingCounter);
      } else {
        const newCounter = document.createElement('div');
        newCounter.className = 'tray-counter';
        newCounter.innerHTML = 'Movs: <span id="moves-count">0</span>';
        tray.appendChild(newCounter);
      }

      winModal.style.display = 'none';
      imageModal.style.display = 'none';
      selectModal.style.display = 'none';
      lockModal.style.display = 'none';
      
      placedCount = 0;
      movesCount = 0;
      const movesEl = document.getElementById('moves-count');
      if (movesEl) movesEl.textContent = movesCount;

      const pieces = [];

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const slot = document.createElement('div');
          slot.classList.add('slot');
          slot.style.width = `${pieceWidth}px`;
          slot.style.height = `${pieceHeight}px`;
          slot.style.left = `${c * pieceWidth}px`;
          slot.style.top = `${r * pieceHeight}px`;
          board.appendChild(slot);

          const piece = document.createElement('div');
          piece.classList.add('piece');
          piece.style.width = `${pieceWidth}px`;
          piece.style.height = `${pieceHeight}px`;
          piece.style.backgroundImage = `url('${currentImageSrc}')`;
          piece.style.backgroundSize = `${boardWidth}px ${boardHeight}px`;
          piece.style.backgroundPosition = `-${c * pieceWidth}px -${r * pieceHeight}px`;

          piece.dataset.correctLeft = c * pieceWidth;
          piece.dataset.correctTop = r * pieceHeight;

          pieces.push(piece);
        }
      }

      pieces.sort(() => Math.random() - 0.5);

      pieces.forEach(piece => {
        const trayWidth = tray.clientWidth;
        const trayHeight = tray.clientHeight;

        const maxLeft = Math.max(0, trayWidth - pieceWidth);
        const maxTop = Math.max(0, trayHeight - pieceHeight - 30);

        const randomLeft = Math.random() * maxLeft;
        const randomTop = Math.random() * maxTop;

        piece.style.left = `${randomLeft}px`;
        piece.style.top = `${randomTop}px`;

        tray.appendChild(piece);
        makeDraggable(piece);
      });
    }

    function makeDraggable(element) {
      let isDragging = false;
      let startX, startY;
      let initialLeft, initialTop;

      const onStart = (e) => {
        if (element.classList.contains('placed')) return;

        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        startX = clientX;
        startY = clientY;

        const rect = element.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;

        document.body.appendChild(element);
        element.style.left = `${initialLeft}px`;
        element.style.top = `${initialTop}px`;
        element.style.zIndex = '1000';
      };

      const onMove = (e) => {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;

        const deltaX = clientX - startX;
        const deltaY = clientY - startY;

        element.style.left = `${initialLeft + deltaX}px`;
        element.style.top = `${initialTop + deltaY}px`;
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        element.style.zIndex = '10';

        movesCount++;
        const movesEl = document.getElementById('moves-count');
        if (movesEl) movesEl.textContent = movesCount;

        const rect = element.getBoundingClientRect();
        const boardRect = board.getBoundingClientRect();

        const currentLeft = rect.left - boardRect.left;
        const currentTop = rect.top - boardRect.top;

        const targetLeft = parseFloat(element.dataset.correctLeft);
        const targetTop = parseFloat(element.dataset.correctTop);

        const tolerance = 30;

        if (
          Math.abs(currentLeft - targetLeft) < tolerance &&
          Math.abs(currentTop - targetTop) < tolerance
        ) {
          element.classList.add('placed');
          element.style.left = `${targetLeft}px`;
          element.style.top = `${targetTop}px`;
          board.appendChild(element);

          placedCount++;
          if (placedCount === TOTAL_PIECES) {
            setTimeout(() => {
              winModal.style.display = 'flex';
            }, 200);
          }
        } else {
          const trayRect = tray.getBoundingClientRect();
          if (
            rect.bottom < trayRect.top ||
            rect.top > trayRect.bottom ||
            rect.right < trayRect.left ||
            rect.left > trayRect.right
          ) {
            tray.appendChild(element);
            element.style.left = `${Math.random() * Math.max(0, tray.clientWidth - pieceWidth)}px`;
            element.style.top = `${Math.random() * Math.max(0, tray.clientHeight - pieceHeight - 30)}px`;
          }
        }
      };

      element.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);

      element.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
    }

    // Eventos de Nível com Trava
    easyBtn.addEventListener('click', () => handleLevelClick('easy', 2, 3));
    mediumBtn.addEventListener('click', () => handleLevelClick('medium', 3, 4));
    hardBtn.addEventListener('click', () => handleLevelClick('hard', 4, 5));

    // Botões dos Modais de Trava e Voltar
    lockResetBtn.addEventListener('click', resetAndClearGame);
    backBtn.addEventListener('click', () => {
      if (currentLevel !== null) {
        resetAndClearGame();
      } else {
        window.history.back();
      }
    });

    selectImgBtn.addEventListener('click', () => {
      renderImageOptions();
      selectModal.style.display = 'flex';
    });

    closeSelectBtn.addEventListener('click', () => {
      selectModal.style.display = 'none';
    });

    modelBtn.addEventListener('click', () => {
      imageModal.style.display = 'flex';
    });

    closeModelBtn.addEventListener('click', () => {
      imageModal.style.display = 'none';
    });

    restartBtn.addEventListener('click', () => {
      if (currentLevel !== null) initGame();
    });

    modalRestartBtn.addEventListener('click', initGame);

    // Inicialização
    const imgLoader = new Image();
    imgLoader.src = currentImageSrc;
    imgLoader.onload = () => setupDimensions();
    imgLoader.onerror = () => setupDimensions();
  </script>
</body>
</html>
