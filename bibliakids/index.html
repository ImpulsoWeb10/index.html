<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aventuras na Bíblia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --sky-top: #050a18;
    --sky-mid: #001233;
    --sky-bottom: #002855;
    --gold: #FFC837;
    --neon-blue: #00d4ff;
    --neon-glow: 0 0 15px rgba(0, 212, 255, 0.6), 0 0 30px rgba(0, 95, 115, 0.4);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; padding: 12px;
    font-family: 'Nunito', sans-serif;
    background: #020611;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    color: #fff;
    overflow-x: hidden;
  }

  /* Moldura da Tela */
  .app-container {
    width: 100%;
    max-width: 480px;
    min-height: calc(100vh - 24px);
    padding: 20px 16px 90px 16px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-bottom) 100%);
    border: 3px solid var(--neon-blue);
    border-radius: 36px;
    box-shadow: var(--neon-glow);
  }

  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
  }

  .btn-icon-round {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: rgba(0, 18, 51, 0.8);
    border: 2px solid var(--neon-blue);
    box-shadow: 0 0 10px var(--neon-blue);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .btn-icon-round svg { width: 24px; height: 24px; fill: none; stroke: var(--neon-blue); stroke-width: 3; }

  .badge-status {
    background: rgba(0, 18, 51, 0.85);
    border: 2px solid var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.4);
    border-radius: 30px;
    padding: 4px 12px 4px 6px;
    display: flex; align-items: center; gap: 8px;
  }
  .badge-status .avatar { width: 34px; height: 34px; border-radius: 50%; background: #FFD54F; display: flex; align-items: center; justify-content: center; border: 2px solid #FFF; }
  .badge-status span { color: #E0F7FA; font-weight: 900; font-size: 0.78rem; line-height: 1.1; }

  .hero-title-area { text-align: center; margin: 10px 0; }
  .main-title {
    font-family: 'Baloo 2', cursive;
    font-size: 2.2rem;
    font-weight: 800;
    line-height: 0.9;
    margin: 0;
    color: #FFF;
    text-shadow: 0 0 10px var(--neon-blue);
    text-transform: uppercase;
  }
  .main-title .sub-yellow { color: var(--gold); text-shadow: 0 0 10px var(--gold); }

  /* CARROSSEL HORIZONTAL DE BOTÕES 500x500 */
  .carousel-wrapper {
    width: 100%;
    margin-top: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .carousel-container {
    width: 100%;
    display: flex;
    gap: 16px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 10px 0 20px 0;
    scrollbar-width: none; /* Esconde scrollbar */
  }
  .carousel-container::-webkit-scrollbar { display: none; }

  /* CARD ELEGANTE DE CADA BOTÃO 500x500 */
  .card-item {
    flex: 0 0 82%;
    max-width: 320px;
    scroll-snap-align: center;
    background: rgba(0, 18, 51, 0.8);
    border: 3px solid var(--neon-blue);
    border-radius: 28px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: var(--neon-glow);
    text-decoration: none;
    transition: transform 0.2s ease;
  }
  .card-item:active { transform: scale(0.97); }

  .card-img-box {
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid var(--neon-blue);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
  }
  .card-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-title {
    font-family: 'Baloo 2', cursive;
    font-size: 1.4rem;
    font-weight: 800;
    color: #FFF;
    text-shadow: 0 0 8px var(--neon-blue);
    margin-top: 10px;
    text-align: center;
  }

  .card-btn-action {
    margin-top: 8px;
    background: linear-gradient(180deg, #00d4ff 0%, #005f73 100%);
    color: #FFF;
    border: none;
    border-radius: 20px;
    padding: 8px 24px;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 1rem;
    box-shadow: 0 0 10px var(--neon-blue);
  }

  /* INDICADOR DE NAVEGAÇÃO */
  .swipe-hint {
    font-size: 0.85rem;
    color: #80DEEA;
    font-weight: 800;
    text-shadow: 0 0 6px var(--neon-blue);
    margin-top: -5px;
  }

  nav.bottom-bar {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%;
    background: rgba(0, 18, 51, 0.95);
    border-top: 2px solid var(--neon-blue);
    border-radius: 0 0 32px 32px;
    padding: 8px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .nav-btn { background: none; border: none; color: #80DEEA; font-family: 'Baloo 2', cursive; font-weight: 700; font-size: 0.75rem; cursor: pointer; }
  .nav-btn.active { color: var(--gold); }
</style>
</head>
