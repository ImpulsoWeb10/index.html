<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Encontre na Bíblia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --neon-blue: #00d4ff;
    --gold: #FFC837;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0; 
    padding: 0;
    font-family: 'Nunito', sans-serif;
    background: #020611;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
  }

  /* CONTAINER DA TELA COM A IMAGEM DE FUNDO */
  .app-container {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 900px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    background: url('capa.jpg') no-repeat center center;
    background-size: cover;
    border-radius: 24px;
    box-shadow: 0 0 20px rgba(0,0,0,0.8);
    overflow: hidden;
  }

  /* BOTÃO SUPERIOR ESQUERDO (MENU) */
  .btn-menu-overlay {
    position: absolute;
    top: 3.2%;
    left: 4.8%;
    width: 14%;
    height: 6.5%;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
  }

  /* BOTÃO SUPERIOR DIREITO (PERFIL) */
  .btn-profile-overlay {
    position: absolute;
    top: 3%;
    right: 4.8%;
    width: 42%;
    height: 6.8%;
    border-radius: 30px;
    cursor: pointer;
    background: transparent;
    border: none;
  }

  /* CARROSSEL DOS JOGOS (DIMINUÍDO E MAIS PARA BAIXO) */
  .carousel-wrapper {
    width: 100%;
    position: absolute;
    top: 64%; /* Movidinho mais para baixo */
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
  }

  .swipe-hint {
    font-size: 0.75rem;
    color: #FFF;
    font-weight: 800;
    text-shadow: 0 2px 4px #000;
    margin-bottom: 4px;
    background: rgba(0, 0, 0, 0.5);
    padding: 2px 10px;
    border-radius: 12px;
  }

  .carousel-container {
    width: 100%;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 6px 16px;
    scrollbar-width: none;
  }
  .carousel-container::-webkit-scrollbar { display: none; }

  /* CARD INTERATIVO MENOR */
  .card-item {
    flex: 0 0 52%;
    max-width: 180px; /* Tamanho reduzido dos botões */
    scroll-snap-align: center;
    background: rgba(2, 6, 17, 0.88);
    border: 2px solid var(--neon-blue);
    border-radius: 18px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 0 12px rgba(0, 212, 255, 0.5);
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .card-item:active { transform: scale(0.95); }

  .card-img-box {
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid var(--neon-blue);
  }
  .card-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-title {
    font-family: 'Baloo 2', cursive;
    font-size: 0.95rem;
    font-weight: 800;
    color: #FFF;
    text-shadow: 0 0 6px var(--neon-blue);
    margin: 4px 0 2px;
    text-align: center;
  }

  .card-btn-action {
    background: linear-gradient(180deg, #00d4ff 0%, #005f73 100%);
    color: #FFF;
    border: none;
    border-radius: 12px;
    padding: 4px 10px;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: 0.8rem;
    box-shadow: 0 0 6px var(--neon-blue);
    width: 100%;
  }

  /* BOTÕES SOBREPOSTOS DO RODAPÉ */
  .bottom-overlay-bar {
    position: absolute;
    bottom: 2%;
    left: 0;
    width: 100%;
    height: 11%;
    display: flex;
    justify-content: space-between;
    padding: 0 8%;
    z-index: 10;
  }

  .btn-bottom-overlay {
    width: 25%;
    height: 100%;
    background: rgba(255, 255, 255, 0);
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }

  .btn-bottom-overlay:active {
    background: rgba(255, 255, 255, 0.2);
  }
</style>
</head>
<body>

      <a href="paginas/quebra-cabeca.html" class="card-item">

      <a href="paginas/verso-do-dia.html" class="card-item">

    </div>
  </div>

  <!-- BOTÕES INVISÍVEIS DO RODAPÉ -->
  <div class="bottom-overlay-bar">
    <button class="btn-bottom-overlay" onclick="window.location.reload();" aria-label="Início"></button>
    <button class="btn-bottom-overlay" onclick="alert('Abrir Configurações!')" aria-label="Configurações"></button>
