<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Encontre na Bíblia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">

<style>
  :root {
    --neon-blue: #00d4ff;
    --gold: #FFC837;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; 
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: 'Nunito', sans-serif;
    background: #020611;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  /* CONTAINER PROPORCIONAL À IMAGEM CAPA (843 x 1264) */
  .app-container {
    position: relative;
    width: 100vw;
    height: 100dvh;
    max-width: calc(100dvh * (843 / 1264)); /* Mantém proporção perfeita da imagem */
    max-height: calc(100vw * (1264 / 843));
    background: url('capa.jpg') no-repeat center center;
    background-size: 100% 100%;
    box-shadow: 0 0 25px rgba(0,0,0,0.9);
    overflow: hidden;
  }

  /* ---------------------------------------------------
     BOTÕES SUPERIORES COM POSICIONAMENTO PRECISO
  --------------------------------------------------- */
  
  /* Botão Menu (Ícone das 3 barras no canto superior esquerdo) */
  .btn-menu-overlay {
    position: absolute;
    top: 2.8%;
    left: 4.2%;
    width: 12.5%;
    height: 6.2%;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
    z-index: 20;
  }

  /* Botão Perfil/Status ("Você está indo bem!" no canto superior direito) */
  .btn-profile-overlay {
    position: absolute;
    top: 2.5%;
    right: 4.2%;
    width: 44%;
    height: 6.5%;
    border-radius: 30px;
    cursor: pointer;
    background: transparent;
    border: none;
    z-index: 20;
  }

  /* ---------------------------------------------------
     CARROSSEL DOS JOGOS (SUBIDO LIGEIRAMENTE)
  --------------------------------------------------- */
  .carousel-wrapper {
    width: 100%;
    position: absolute;
    top: 66%; /* Posição ajustada logo abaixo da Bíblia */
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 10;
  }

  .swipe-hint {
    font-size: clamp(0.65rem, 2.5vw, 0.75rem);
    color: #FFF;
    font-weight: 800;
    text-shadow: 0 2px 4px #000;
    margin-bottom: 4px;
    background: rgba(0, 0, 0, 0.65);
    padding: 2px 10px;
    border-radius: 12px;
  }

  .carousel-container {
    width: 100%;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 4px 16px;
    scrollbar-width: none;
  }
  .carousel-container::-webkit-scrollbar { display: none; }

  /* CARD INTERATIVO */
  .card-item {
    flex: 0 0 44%;
    max-width: 145px;
    scroll-snap-align: center;
    background: rgba(2, 6, 17, 0.92);
    border: 2px solid var(--neon-blue);
    border-radius: 16px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .card-item:active { transform: scale(0.95); }

  .card-img-box {
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--neon-blue);
  }
  .card-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-title {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(0.75rem, 2.8vw, 0.85rem);
    font-weight: 800;
    color: #FFF;
    text-shadow: 0 0 6px var(--neon-blue);
    margin: 3px 0 2px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }

  .card-btn-action {
    background: linear-gradient(180deg, #00d4ff 0%, #005f73 100%);
    color: #FFF;
    border: none;
    border-radius: 10px;
    padding: 3px 6px;
    font-family: 'Baloo 2', cursive;
    font-weight: 800;
    font-size: clamp(0.68rem, 2.6vw, 0.75rem);
    box-shadow: 0 0 6px var(--neon-blue);
    width: 100%;
  }

  /* ---------------------------------------------------
     BOTÕES INFERIORES COM POSICIONAMENTO EXATO
  --------------------------------------------------- */
  
  /* Botão Início (Casinha Amarela / Canto Inferior Esquerdo) */
  .btn-home-overlay {
    position: absolute;
    bottom: 3.5%;
    left: 18.5%;
    width: 18%;
    height: 8.5%;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
    z-index: 20;
  }

  /* Botão Configurações (Engrenagem Azul / Canto Inferior Direito) */
  .btn-config-overlay {
    position: absolute;
    bottom: 3.5%;
    right: 18.5%;
    width: 18%;
    height: 8.5%;
    border-radius: 50%;
    cursor: pointer;
    background: transparent;
    border: none;
    z-index: 20;
  }

  /* Efeito de toque para feedback do clique */
  .btn-menu-overlay:active,
  .btn-profile-overlay:active,
  .btn-home-overlay:active,
  .btn-config-overlay:active {
    background: rgba(255, 255, 255, 0.25);
  }
</style>
</head>
<body>

<div class="app-container">

  <!-- 1. BOTÃO MENU (Canto Superior Esquerdo) -->
  <button class="btn-menu-overlay" onclick="alert('Menu aberto!')" aria-label="Menu"></button>

  <button class="btn-profile-overlay" onclick="alert('Perfil do Usuário!')" aria-label="Perfil"></button>

  <div class="carousel-wrapper">

      <a href="paginas/historias.html" class="card-item">

      <a href="paginas/monte-palavras.html" class="card-item">

      <a href="paginas/perguntas.html" class="card-item">

      </a>

      <a href="paginas/perguntas-arca.html" class="card-item">

      </a>

      <a href="paginas/quebra-cabeca.html" class="card-item">

      </a>

      <a href="paginas/verso-do-dia.html" class="card-item">

      <a href="paginas/minhas-medalhas.html" class="card-item">

    </div>
  </div>

  <!-- 4. BOTÃO INÍCIO (Exatamente sobre a casinha amarela) -->
  <button class="btn-home-overlay" onclick="window.location.reload();" aria-label="Início"></button>

  <!-- 5. BOTÃO CONFIGURAÇÕES (Exatamente sobre a engrenagem azul) -->

</div>
