        body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    </style>

<body class="bg-slate-50 min-h-screen text-slate-800 pb-16">

    <!-- Cabeçalho Estilo App CCB -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg border-b border-slate-800">
        <div class="px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <!-- Imagem Logo CCB -->
                <div class="w-12 h-12 bg-white rounded-2xl shadow-md flex items-center justify-center shrink-0 p-1.5 border border-slate-700/50">
                    <img src="logoccb.png" alt="Logo CCB" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/4300/4300058.png';">
                </div>
                <div>
                    <div class="flex items-center gap-1.5">
                        <span class="text-[10px] bg-amber-400 text-slate-950 font-extrabold px-1.5 py-0.5 rounded uppercase tracking-wider">CCB</span>
                        <h1 class="text-base font-extrabold tracking-tight">Ensaios Locais</h1>
                    </div>
                    <p class="text-slate-400 text-xs font-medium">Itaquaquecetuba • 2026</p>
                </div>
            </div>
            
            <div class="bg-slate-800/90 border border-slate-700/70 px-3.5 py-1.5 rounded-2xl text-center">
                <span class="block text-[9px] text-slate-400 uppercase tracking-wider font-semibold">Total</span>
                <span id="total-count" class="text-sm font-black text-amber-400">50</span>
            </div>
        </div>

        <!-- Grade de Filtros Fixa em 2 Colunas (2x2) Sem Rolagem Lateral -->
        <div class="bg-slate-950/90 border-t border-slate-800/80 px-4 py-3.5">
            <div class="grid grid-cols-2 gap-2.5">
                <!-- Filtro Bairro / Comum -->
                <div class="relative">
                    <input type="text" id="search-input" placeholder="Bairro / Comum..." 
                        class="w-full pl-8 pr-2.5 py-2.5 bg-slate-800 text-slate-100 text-xs font-bold rounded-xl border border-slate-700 focus:outline-none focus:border-amber-400 placeholder-slate-400 shadow-xs">
                    <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-3.5 text-slate-400 text-xs"></i>
                </div>

                <!-- Filtro Setor -->
                <select id="filter-setor" class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2.5 rounded-xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 cursor-pointer shadow-xs">
                    <option value="">Setores (Todos)</option>
                    <option value="1">Setor 1</option>
                    <option value="2">Setor 2</option>
                    <option value="3">Setor 3</option>
                    <option value="4">Setor 4</option>
                </select>

                <!-- Filtro Dia da Semana -->
                <select id="filter-dia" class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2.5 rounded-xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 cursor-pointer shadow-xs">
                    <option value="">Dia da Semana</option>
                    <option value="S">Sábado (S)</option>
                    <option value="D">Domingo (D)</option>
                    <option value="6°">Sexta (6°)</option>
                </select>

                <!-- Filtro Horário -->
                <select id="filter-hora" class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2.5 rounded-xl border border-slate-700 font-bold focus:outline-none focus:border-amber-400 cursor-pointer shadow-xs">
                    <option value="">Horário</option>
                    <option value="16h">16:00</option>
                    <option value="16:30">16:30</option>
                    <option value="17h">17:00</option>
                    <option value="19:00">19:00</option>
                    <option value="19:30">19:30</option>
                </select>
            </div>

            <!-- Botão Limpar Filtros -->
            <button onclick="resetFilters()" class="w-full mt-2.5 py-1.5 text-center text-xs text-amber-400 hover:text-amber-300 font-extrabold bg-slate-800/40 hover:bg-slate-800/70 rounded-xl border border-slate-700/60 transition">
                <i class="fa-solid fa-arrows-rotate mr-1 text-[10px]"></i> Limpar Seleções
            </button>
        </div>
    </header>

    <!-- Lista Principal de Igrejas / Ensaios -->

        <div id="cards-container" class="space-y-3">
            <!-- Cards injetados via JavaScript -->
        </div>

            <p class="text-slate-400 text-xs mt-1">Tente alterar os filtros selecionados.</p>

    </main>

                    <i class="fa-regular fa-calendar-days text-amber-600 text-base"></i> <span id="modal-ensaio"></span>

            </div>

            <!-- Card de Endereço -->

                <div>
                    <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-1">Endereço Completo</span>
                    <p id="modal-endereco" class="text-xs text-slate-700 font-semibold leading-relaxed"></p>
                </div>
                <div class="pt-2 border-t border-slate-200/60 flex items-center justify-between">
                    <div>
                        <span class="text-[10px] font-bold text-slate-400 uppercase block">CEP</span>
                        <span id="modal-cep" class="text-xs font-bold text-slate-800"></span>
                    </div>
                </div>
            </div>

            <!-- Botão do Google Maps -->

        const container = document.getElementById('cards-container');
        const searchInput = document.getElementById('search-input');
        const filterSetor = document.getElementById('filter-setor');
        const filterDia = document.getElementById('filter-dia');
        const filterHora = document.getElementById('filter-hora');
        const noResults = document.getElementById('no-results');
        const totalCount = document.getElementById('total-count');

        function renderCards(data) {
            container.innerHTML = '';
            totalCount.textContent = data.length;
            
            if(data.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl p-4 shadow-xs border border-slate-100 hover:border-slate-300 active:scale-[0.99] transition-all flex items-center justify-between gap-3 cursor-pointer";
                card.onclick = () => openModal(item);
                
                card.innerHTML = `
                    <div class="min-w-0 flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="bg-slate-100 text-slate-800 text-[10px] font-bold px-2.5 py-0.5 rounded-full border border-slate-200">Setor ${item.setor}</span>
                            <span class="text-xs text-slate-400 truncate"><i class="fa-solid fa-church text-[10px] mr-1"></i> CCB</span>
                        </div>
                        <h4 class="text-sm font-bold text-slate-900 truncate">${item.bairro}</h4>
                        <div class="mt-1.5 text-xs text-amber-800 font-semibold flex items-center gap-1.5">
                            <i class="fa-regular fa-clock text-[11px] text-amber-600"></i>
                            <span>${item.ensaio}</span>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 shrink-0 border border-slate-100">
                        <i class="fa-solid fa-chevron-right text-xs"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterData() {
            const searchTerm = searchInput.value.toLowerCase();
            const setorVal = filterSetor.value;
            const diaVal = filterDia.value;
            const horaVal = filterHora.value;

            const filtered = agendaData.filter(item => {
                const matchSearch = item.bairro.toLowerCase().includes(searchTerm);
                const matchSetor = setorVal === "" || item.setor === setorVal;
                const matchDia = diaVal === "" || item.ensaio.toUpperCase().includes(diaVal.toUpperCase());
                const matchHora = horaVal === "" || item.ensaio.toLowerCase().includes(horaVal.toLowerCase());
                
                return matchSearch && matchSetor && matchDia && matchHora;
            });

            renderCards(filtered);
        }

        function resetFilters() {
            searchInput.value = '';
            filterSetor.value = '';
            filterDia.value = '';
            filterHora.value = '';
            renderCards(agendaData);
        }

        searchInput.addEventListener('input', filterData);
        filterSetor.addEventListener('change', filterData);
        filterDia.addEventListener('change', filterData);
        filterHora.addEventListener('change', filterData);

        // Modal Controls
        const modal = document.getElementById('detail-modal');
        const modalContainer = document.getElementById('modal-container');

        function openModal(item) {
            document.getElementById('modal-setor').textContent = `Setor ${item.setor}`;
            document.getElementById('modal-bairro').textContent = item.bairro;
            document.getElementById('modal-ensaio').textContent = item.ensaio;
            document.getElementById('modal-endereco').textContent = item.endereco;
            document.getElementById('modal-cep').textContent = item.cep;

            const mapsQuery = encodeURIComponent(`CCB ${item.bairro} ${item.endereco}`);
            document.getElementById('modal-maps-link').href = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContainer.classList.remove('translate-y-full', 'sm:scale-95');
                modalContainer.classList.add('translate-y-0', 'sm:scale-100');
            }, 10);
        }

        function closeModal() {
            modal.classList.add('opacity-0');
            modalContainer.classList.remove('translate-y-0', 'sm:scale-100');
            modalContainer.classList.add('translate-y-full', 'sm:scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        modal.addEventListener('click', (e) => {
            if(e.target === modal) closeModal();
        });

        // Inicializar com todas as congregações
        renderCards(agendaData);
    </script>
</body>
</html>
