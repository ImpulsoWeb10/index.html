  .carousel-wrapper {

    top: 65%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;

  .swipe-hint {

    font-weight: 800;
    text-shadow: 0 2px 4px #000;
    margin-bottom: 4px;
    background: rgba(0, 0, 0, 0.65);
    padding: 2px 10px;
    border-radius: 12px;
  }

  .carousel-container {
    width: 100%;
    display: flex;
    gap: 12px;
    overflow-x: auto;
    /* Padding para permitir que o primeiro e o último card cheguem até o meio */
    padding: 25px calc(50% - 70px);
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
  }
  .carousel-container::-webkit-scrollbar { display: none; }

  /* CARD INTERATIVO */
  .card-item {
    flex: 0 0 140px;
    background: rgba(2, 6, 17, 0.92);
    border: 2px solid var(--neon-blue);
    border-radius: 16px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.3);
    text-decoration: none;
    scroll-snap-align: center;
    
    /* Transição suave para o efeito de escala e transparência */
    transition: transform 0.2s ease-out, opacity 0.2s ease-out, box-shadow 0.2s ease-out;
    transform: scale(0.78);
    opacity: 0.6;
  }

  /* ESTILO DO CARD NO CENTRO (ATIVO) */
  .card-item.active {
    transform: scale(1.18) !important;
    opacity: 1 !important;
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.9);
    z-index: 5;
  }

  .card-img-box {
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--neon-blue);
  }
  .card-img-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .card-title {
    font-family: 'Baloo 2', cursive;
    font-size: clamp(0.75rem, 2.8vw, 0.85rem);
    font-weight: 800;
    color: #FFF;
    text-shadow: 0 0 6px var(--neon-blue);
    margin: 3px 0 2px;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
  }

  .card-btn-action {
    background: linear-gradient(180deg, #00d4ff 0%, #005f73 100%);

    border: none;
    border-radius: 10px;
    padding: 3px 6px;

    width: 100%;
    cursor: pointer;

  .btn-home-overlay {

</style>

<script>
  const container = document.getElementById('carousel');
  const cards = document.querySelectorAll('.card-item');
  let autoScrollTimer = null;

  // Função que detecta a distância de cada card do centro e aplica o destaque
  function updateCardScales() {
    const containerCenter = container.getBoundingClientRect().left + container.clientWidth / 2;

    cards.forEach(card => {
      const cardRect = card.getBoundingClientRect();
      const cardCenter = cardRect.left + cardRect.width / 2;
      const distance = Math.abs(containerCenter - cardCenter);

      // Se o card estiver bem próximo do centro (menos de 60px de tolerância)
      if (distance < 60) {
        card.classList.add('active');
      } else {
        card.classList.remove('active');
      }
    });
  }

  // Rola automaticamente devagar
  function startAutoScroll() {
    stopAutoScroll();
    autoScrollTimer = setInterval(() => {
      if (container.scrollLeft + container.clientWidth >= container.scrollWidth - 2) {
        container.scrollLeft = 0;
      } else {
        container.scrollLeft += 1;
      }
      updateCardScales();
    }, 25);
  }

  function stopAutoScroll() {
    if (autoScrollTimer) {
      clearInterval(autoScrollTimer);
      autoScrollTimer = null;
    }
  }

  // Eventos de rolagem e toque
  container.addEventListener('scroll', updateCardScales);
  container.addEventListener('touchstart', stopAutoScroll, { passive: true });
  container.addEventListener('mousedown', stopAutoScroll);

  // Inicialização
  updateCardScales();
  startAutoScroll();
</script>
