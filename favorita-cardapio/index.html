<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esfiraria Juliana</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Topo / Header Estilo App -->
    <header class="app-header">
        <div class="header-logo-area">
            <img src="Logo.png" alt="Logo" class="logo-img">
            <div class="header-text">
                <h2>Esfiraria Juliana</h2>
                <p>O verdadeiro sabor em cada mordida!</p>
            </div>
        </div>
        <button class="menu-btn" onclick="abrirMenuLateral()">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- Conteúdo Principal -->
    <main class="app-main">
        
        <!-- Tela Inicial: Cards Principais com Subbotões (Idêntico à referência) -->
        <div id="view-home" class="view-section">
            <div class="cards-container" id="cards-principais-container">
                <!-- Os cards principais serão renderizados dinamicamente aqui baseados nas categorias e subcategorias do Google Sheets -->
            </div>
        </div>

        <!-- Tela de Listagem de Produtos de uma Subcategoria -->
        <div id="view-produtos" class="view-section hidden">
            <button class="btn-voltar-home" onclick="voltarParaHome()">
                <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
            </button>
            <h3 id="titulo-secao-produtos" class="secao-titulo">Produtos</h3>
            <div id="lista-produtos" class="produtos-grid">
                <!-- Produtos carregados do Google Sheets -->
            </div>
        </div>

    </main>

    <!-- Rodapé Personalizado (Solicitado) -->
    <footer class="app-footer-dev">
        <p>Desenvolvido por <strong>ImpulsoWeb10</strong></p>
        <p>
            <a href="https://wa.me/5511954950044?text=Olá!%20Quero%20saber%20mais%20sobre%20esse%20app%20Favorita" target="_blank">
                ( Crie seu app ou link de Avaliação - Saiba Mais )
            </a>
        </p>
    </footer>

    <!-- Barra de Navegação Inferior (Fixa igual à imagem de referência) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="voltarParaHome()">
            <i class="fa-solid fa-house"></i>
            <span>Início</span>
        </a>
        <a href="#" class="nav-item" onclick="verPedidosCarrinho()">
            <i class="fa-solid fa-clipboard-list"></i>
            <span>Pedidos</span>
        </a>
        <a href="https://wa.me/5511954950044?text=Olá!%20Gostaria%20de%20deixar%20uma%20avaliação%20para%20o%20app." target="_blank" class="nav-item">
            <i class="fa-solid fa-star"></i>
            <span>Avaliações</span>
        </a>
        <a href="https://wa.me/5511954950044?text=Olá!%20Preciso%20de%20suporte%20sobre%20o%20app." target="_blank" class="nav-item">
            <i class="fa-solid fa-phone"></i>
            <span>Contato</span>
        </a>
    </nav>

    <!-- Carrinho Flutuante -->
    <div id="carrinho-flutuante" class="carrinho-flutuante hidden">
        <div class="carrinho-info">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="contador-carrinho">0</span> itens | <span id="valor-total">R$ 0,00</span>
        </div>
        <button onclick="finalizarPedidoWhatsapp()">Pedir WhatsApp</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
