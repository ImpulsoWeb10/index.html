<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Planejador de Eventos | Academia Spartan Fight Fit</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
h1,h3,h4,.nb b{font-family:'Oswald',Impact,sans-serif;letter-spacing:.06em}
#app{height:100dvh;max-width:440px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:radial-gradient(ellipse at 50% -10%,#3a0a14 0,#0a0a0a 62%)}
header{text-align:center;position:relative}
.logo{font-size:30px;filter:drop-shadow(0 0 10px #ff2d55)}
h1{margin:0;font-size:24px;text-transform:uppercase;text-shadow:0 0 12px #ff2d55}
h1 i{color:#ff2d55;font-style:normal}
header p{margin:2px 0 0;font-size:11px;color:#9a9a9a;letter-spacing:.12em;text-transform:uppercase}
#rs{position:absolute;right:0;top:0;width:34px;height:34px;border-radius:50%;background:none;color:#fff;border:1.5px solid #555;font-size:16px;cursor:pointer}
.nb{--c:#ff2d55;background:rgba(255,255,255,.02);color:#fff;border:1.5px solid var(--c);border-radius:14px;padding:12px;font:inherit;cursor:pointer;text-align:center;box-shadow:0 0 10px color-mix(in srgb,var(--c) 50%,transparent),inset 0 0 10px color-mix(in srgb,var(--c) 22%,transparent);transition:transform .12s,box-shadow .2s}
.nb:hover{box-shadow:0 0 18px var(--c),inset 0 0 14px color-mix(in srgb,var(--c) 35%,transparent)}
.nb:active{transform:scale(.97)}
.nb.sel{background:color-mix(in srgb,var(--c) 22%,transparent);box-shadow:0 0 16px var(--c),inset 0 0 12px var(--c)}
.cfg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sq{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}
.sq span{font-size:22px}.sq b{font-size:12px}.sq small{font-size:10px;color:#cfcfcf;line-height:1.2}
.res{flex:1;min-height:0;max-height:150px;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:left}
.rt{display:flex;align-items:center;gap:8px}.rt span{font-size:26px}.rt b{font-size:18px;flex:1}
.rt em{font-style:normal;font-weight:700;color:var(--c);text-shadow:0 0 8px var(--c)}
.bar{height:8px;background:#1c1c1c;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--c,#ff2d55);box-shadow:0 0 8px var(--c,#ff2d55);transition:width .3s}
.bar i.ok{background:#39ff14;box-shadow:0 0 8px #39ff14}
.res small{font-size:11px;color:#bbb}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act .nb{font-weight:700;font-size:13px;padding:13px 6px}
footer{text-align:center;font-size:10px;color:#666}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:9}
#ov.on{display:flex}
#pn{width:100%;max-width:440px;max-height:88dvh;overflow:auto;background:#0f0f12;border:1.5px solid #ff2d55;border-bottom:0;border-radius:22px 22px 0 0;padding:14px 14px max(14px,env(safe-area-inset-bottom));box-shadow:0 0 24px rgba(255,45,85,.45);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(min-width:600px){#ov{align-items:center}#pn{border-radius:22px;border-bottom:1.5px solid #ff2d55}}
@media(max-height:640px){h1{font-size:20px}.logo{font-size:24px}.res{max-height:120px}}
.mh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mh h3{flex:1;margin:0;font-size:18px;text-align:center;text-transform:uppercase}
.mh button{width:38px;height:38px;border-radius:50%;background:none;color:#fff;border:1.5px solid #ff2d55;font-size:16px;cursor:pointer;box-shadow:0 0 8px rgba(255,45,85,.6)}
.grid1{display:grid;gap:8px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.opt{font-weight:700;padding:14px;font-size:15px}
.it{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;padding:10px 6px}
.it span{font-size:24px}.it em{font-style:normal;font-size:11px;color:var(--c);font-weight:700}
.pl{padding:9px 4px;font-size:12px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #222;font-size:14px}
.row small{display:block;color:#888;font-size:11px}
.ck input{accent-color:#39ff14;width:18px;height:18px;margin-right:8px}.ck{justify-content:flex-start}
.ct,.qty{display:flex;align-items:center;gap:8px;justify-content:center}
.ct button,.qty button,.rm{min-width:40px;height:40px;border-radius:12px;background:#17171b;border:1.5px solid #39ff14;color:#fff;font-size:15px;font-weight:700;box-shadow:0 0 8px rgba(57,255,20,.4);cursor:pointer}
.rm{border-color:#ff2d55;box-shadow:0 0 8px rgba(255,45,85,.5);min-width:34px;height:34px}
input[type=number]{width:62px;height:40px;text-align:center;background:#0a0a0a;border:1.5px solid #333;border-radius:12px;color:#fff;font-size:18px;font-weight:700}
.hint{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.1em;margin:12px 0 8px;text-align:center}
.tot{text-align:center;font-weight:700;color:#00e5ff;margin:8px 0 0;font-size:13px}
h4{margin:14px 0 4px;font-size:15px;text-transform:uppercase}
#mb>.nb{width:100%;margin-top:14px;font-weight:700}
#tt{position:fixed;top:14px;left:50%;transform:translate(-50%,-30px);background:#111;border:1.5px solid #39ff14;color:#fff;padding:9px 16px;border-radius:14px;font-size:13px;box-shadow:0 0 14px rgba(57,255,20,.5);opacity:0;pointer-events:none;transition:.3s;z-index:20;max-width:90vw;text-align:center}
#tt.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">🥊</div>
    <h1>Spartan <i>Fight Fit</i></h1>
    <p>Planejador de Eventos · Jd. Caiubi</p>
    <button id="rs" aria-label="Novo evento" onclick="A.reset()">⟲</button>
  </header>

  <div class="cfg">
    <button class="nb sq" style="--c:#ff2d55" onclick="A.o('Participantes',vPart)"><span>👥</span><b>PARTICIPANTES</b><small id="v-part"></small></button>
    <button class="nb sq" style="--c:#ffb300" onclick="A.o('Duração',vDur)"><span>⏱️</span><b>DURAÇÃO</b><small id="v-dur"></small></button>
    <button class="nb sq" style="--c:#b967ff" onclick="A.o('Tipo de evento',vEv)"><span>🏆</span><b>EVENTO</b><small id="v-ev"></small></button>
  </div>

  <button class="nb res" style="--c:#ff2d55" onclick="A.o('Lanches',vLan)">
    <div class="rt"><span>🥪</span><b>LANCHES</b><em id="v-l"></em></div>
    <div class="bar"><i id="b-l"></i></div><small id="s-l"></small>
  </button>
  <button class="nb res" style="--c:#00e5ff" onclick="A.o('Bebidas',vBeb)">
    <div class="rt"><span>🥤</span><b>BEBIDAS</b><em id="v-b"></em></div>
    <div class="bar"><i id="b-b"></i></div><small id="s-b"></small>
  </button>

  <div class="act">
    <button class="nb" style="--c:#39ff14" onclick="A.o('Lista de compras',vLista)">📋 LISTA</button>
    <button class="nb" style="--c:#25d366" onclick="A.wa()">📱 WHATSAPP</button>
  </div>
  <footer>Desenvolvido por ImpulsoWeb10</footer>
</div>

<div id="ov"><div id="pn">
  <div class="mh"><button onclick="A.back()" aria-label="Voltar">←</button><h3 id="mt"></h3><button onclick="A.close()" aria-label="Fechar">✕</button></div>
  <div id="mb"></div>
</div></div>
<div id="tt"></div>

<script>
const $=s=>document.querySelector(s);
const EVENTOS={
  treino:{n:'Treinão / Aulão',e:'🏋️',p:[3,2,1.2,.8]},
  luta:{n:'Campeonato de Luta',e:'🥊',p:[4,3,1.5,1]},
  grad:{n:'Graduação de Faixa',e:'🥋',p:[6,5,.8,.6]},
  confra:{n:'Confraternização',e:'🎉',p:[8,5,1,.7]},
  exp:{n:'Aula Experimental',e:'🎯',p:[2,2,.8,.6]}
}; // p = [lanches adulto, lanches criança, litros adulto, litros criança]
const DURS={curta:{n:'Até 2h',m:.8},media:{n:'2 a 4h',m:1},longa:{n:'Mais de 4h',m:1.3}};
const LANCHES=[
  {id:'sand',n:'Sanduíche Natural',e:'🥪'},{id:'wrap',n:'Wrap de Frango',e:'🌯'},
  {id:'pao',n:'Pão de Queijo',e:'🧀'},{id:'barra',n:'Barra de Proteína',e:'🍫'},
  {id:'fruta',n:'Frutas',e:'🍌'},{id:'bolo',n:'Bolo Fit',e:'🍰'},
  {id:'tapi',n:'Tapioca',e:'🥞'},{id:'salg',n:'Salgado Assado',e:'🥟'}
];
const BEBIDAS=[
  {id:'agua',n:'Água Mineral',e:'💧',t:['Sem Gás','Com Gás'],s:[['500 ml',.5],['1,5 L',1.5]]},
  {id:'iso',n:'Isotônico',e:'⚡',t:['Laranja','Limão','Tangerina','Uva'],s:[['500 ml',.5],['1 L',1]]},
  {id:'suco',n:'Suco Natural',e:'🧃',t:['Laranja','Uva','Maracujá','Limão'],s:[['300 ml',.3],['1 L',1],['2 L',2]]},
  {id:'shake',n:'Shake / Whey',e:'🥛',t:['Chocolate','Morango','Baunilha'],s:[['250 ml',.25],['400 ml',.4]]},
  {id:'coco',n:'Água de Coco',e:'🥥',t:['Natural'],s:[['200 ml',.2],['1 L',1]]}
];

const K='spartan_evento_v1';
const S={ad:20,kd:5,dur:'media',ev:'treino',lan:{},beb:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

const meta=()=>{const[sa,sk,la,lk]=EVENTOS[S.ev].p,m=DURS[S.dur].m;
  return{l:Math.max(10,Math.round((S.ad*sa+S.kd*sk)*m/5)*5),b:Math.max(2,Math.round((S.ad*la+S.kd*lk)*m*2)/2)}};
const totL=()=>Object.values(S.lan).reduce((a,x)=>a+x.q,0);
const totB=()=>Object.values(S.beb).reduce((a,x)=>a+x.q*x.v,0);

/* ---------- Tela principal ---------- */
function fill(k,t,m,u,d){
  $('#v-'+k).textContent=`${t.toFixed(d)} / ${m}${u}`;
  const b=$('#b-'+k);b.style.width=Math.min(100,t/m*100)+'%';b.classList.toggle('ok',t>=m);
  $('#s-'+k).textContent=t>=m?'✅ Meta atingida! Toque para ajustar':`Faltam ${(m-t).toFixed(d)}${u} · toque para escolher`;
}
function render(){
  const m=meta();
  $('#v-part').textContent=`${S.ad} adultos · ${S.kd} crianças`;
  $('#v-dur').textContent=DURS[S.dur].n;
  $('#v-ev').textContent=EVENTOS[S.ev].n;
  fill('l',totL(),m.l,' un',0);fill('b',totB(),m.b,' L',1);
}

/* ---------- Sistema de modais (pilha: voltar / fechar) ---------- */
const A={t:null};let stack=[];
function draw(){const t=stack[stack.length-1];$('#mt').textContent=t.t;t.f();}
A.o=(t,f)=>{stack.push({t,f});$('#ov').classList.add('on');draw();};
A.back=()=>{stack.pop();stack.length?draw():A.close();};
A.close=()=>{stack=[];$('#ov').classList.remove('on');render();};
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')A.close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&stack.length)A.close()});
function toast(m){const t=$('#tt');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);}
const pg=(t,m,u,d)=>`<div class="bar"><i class="${t>=m?'ok':''}" style="width:${Math.min(100,t/m*100)}%"></i></div><p class="tot">${t.toFixed(d)} / ${m}${u}</p>`;

/* ---------- Participantes ---------- */
const cnt=(l,k,s)=>`<div class="row"><div><b>${l}</b><small>${s}</small></div><div class="ct"><button onclick="A.adj('${k}',-1)">−</button><input type="number" min="0" inputmode="numeric" value="${S[k]}" onchange="A.setN('${k}',this.value)"><button onclick="A.adj('${k}',1)">+</button></div></div>`;
function vPart(){$('#mb').innerHTML=cnt('Adultos','ad','Alunos e acompanhantes')+cnt('Crianças / Teens','kd','Turma kids e juvenil')+`<button class="nb" style="--c:#39ff14" onclick="A.close()">CONFIRMAR</button>`;}
A.adj=(k,d)=>{S[k]=Math.max(0,S[k]+d);save();draw();};
A.setN=(k,v)=>{S[k]=Math.max(0,parseInt(v)||0);save();draw();};

/* ---------- Duração e Evento ---------- */
function vDur(){$('#mb').innerHTML=`<div class="grid1">${Object.entries(DURS).map(([k,d])=>`<button class="nb opt ${S.dur==k?'sel':''}" style="--c:#ffb300" onclick="A.pick('dur','${k}')">⏱️ ${d.n}</button>`).join('')}</div>`;}
function vEv(){$('#mb').innerHTML=`<div class="grid2">${Object.entries(EVENTOS).map(([k,d])=>`<button class="nb it ${S.ev==k?'sel':''}" style="--c:#b967ff" onclick="A.pick('ev','${k}')"><span>${d.e}</span>${d.n}</button>`).join('')}</div>`;}
A.pick=(k,v)=>{S[k]=v;save();A.close();};

/* ---------- Lanches ---------- */
function vLan(){
  $('#mb').innerHTML=pg(totL(),meta().l,' un',0)+`<p class="hint">Toque para adicionar</p><div class="grid2">${LANCHES.map(i=>`<button class="nb it" style="--c:#ff2d55" onclick="A.qL('${i.id}')"><span>${i.e}</span>${i.n}${S.lan[i.id]?`<em>${S.lan[i.id].q} un</em>`:''}</button>`).join('')}</div>`;
}
A.qL=id=>{
  const i=LANCHES.find(x=>x.id==id);A.t={q:S.lan[id]?S.lan[id].q:20};
  A.o(i.e+' '+i.n,()=>{$('#mb').innerHTML=`<p class="hint">Quantas unidades?</p><div class="qty">${[-10,-1].map(d=>`<button onclick="A.tq(${d})">${d}</button>`).join('')}<input id="tq" type="number" min="1" inputmode="numeric" value="${A.t.q}" oninput="A.t.q=Math.max(1,parseInt(this.value)||1)">${[1,10].map(d=>`<button onclick="A.tq(${d})">+${d}</button>`).join('')}</div><button class="nb" style="--c:#39ff14" onclick="A.addL('${id}')">ADICIONAR</button>${S.lan[id]?`<button class="nb" style="--c:#ff2d55" onclick="A.remL('${id}')">REMOVER</button>`:''}`;});
};
A.tq=d=>{A.t.q=Math.max(1,(parseInt($('#tq').value)||0)+d);$('#tq').value=A.t.q;};
A.addL=id=>{const i=LANCHES.find(x=>x.id==id);S.lan[id]={n:i.n,e:i.e,q:A.t.q};save();toast(`✅ ${i.n} (${A.t.q} un) adicionado`);A.back();};
A.remL=id=>{delete S.lan[id];save();A.back();};

/* ---------- Bebidas ---------- */
function vBeb(){
  const sel=Object.entries(S.beb);
  $('#mb').innerHTML=pg(totB(),meta().b,' L',1)+`<p class="hint">Toque para configurar</p><div class="grid2">${BEBIDAS.map(i=>{const l=Object.values(S.beb).filter(x=>x.id==i.id).reduce((a,x)=>a+x.q*x.v,0);return `<button class="nb it" style="--c:#00e5ff" onclick="A.qB('${i.id}')"><span>${i.e}</span>${i.n}${l?`<em>${l.toFixed(1)} L</em>`:''}</button>`}).join('')}</div>`+
  (sel.length?`<p class="hint">Selecionadas</p>${sel.map(([k,x])=>`<div class="row"><span>${x.e} ${x.n} · ${x.sub} · ${x.z}<small>${x.q}x = ${(x.q*x.v).toFixed(1)} L</small></span><button class="rm" onclick="A.rmB('${k}')" aria-label="Remover">✕</button></div>`).join('')}`:'');
}
A.rmB=k=>{delete S.beb[k];save();draw();};
A.qB=id=>{const i=BEBIDAS.find(x=>x.id==id);A.t={i,s:0,z:i.s.length-1,q:2};A.o(i.e+' '+i.n,vB);};
function vB(){
  const{i,s,z,q}=A.t;
  const pill=(a,k,c)=>a.map((x,n)=>`<button class="nb pl ${n==c?'sel':''}" style="--c:#00e5ff" onclick="A.tb('${k}',${n})">${x}</button>`).join('');
  $('#mb').innerHTML=`<p class="hint">Sabor / tipo</p><div class="grid3">${pill(i.t,'s',s)}</div><p class="hint">Embalagem</p><div class="grid3">${pill(i.s.map(x=>x[0]),'z',z)}</div><p class="hint">Quantidade</p><div class="qty"><button onclick="A.tb('q',${q-1})">−</button><input type="number" min="1" inputmode="numeric" value="${q}" onchange="A.tb('q',this.value)"><button onclick="A.tb('q',${q+1})">+</button></div><p class="tot">Total: ${(q*i.s[z][1]).toFixed(1)} L</p><button class="nb" style="--c:#39ff14" onclick="A.addB()">ADICIONAR BEBIDA</button>`;
}
A.tb=(k,v)=>{A.t[k]=k=='q'?Math.max(1,parseInt(v)||1):+v;draw();};
A.addB=()=>{const{i,s,z,q}=A.t;S.beb[`${i.id}_${s}_${z}`]={id:i.id,n:i.n,e:i.e,sub:i.t[s],z:i.s[z][0],v:i.s[z][1],q};save();toast(`🥤 ${i.n} (${i.t[s]}) adicionado`);A.back();};

/* ---------- Lista, WhatsApp e reset ---------- */
const chk=h=>`<label class="row ck"><input type="checkbox"><span>${h}</span></label>`;
function vLista(){
  const L=Object.values(S.lan),B=Object.values(S.beb);
  $('#mb').innerHTML=`<p class="hint" style="margin-top:0">${S.ad} adultos · ${S.kd} crianças · ${EVENTOS[S.ev].n} · ${DURS[S.dur].n}</p><h4 style="color:#ff2d55">🥪 Lanches</h4>${L.length?L.map(x=>chk(`<b>${x.q}x</b> ${x.e} ${x.n}`)).join(''):'<small style="color:#888">Nenhum ainda.</small>'}<h4 style="color:#00e5ff">🥤 Bebidas</h4>${B.length?B.map(x=>chk(`<b>${x.q}x</b> ${x.e} ${x.n} (${x.sub} · ${x.z})`)).join(''):'<small style="color:#888">Nenhuma ainda.</small>'}<button class="nb" style="--c:#25d366" onclick="A.wa()">📱 ENVIAR NO WHATSAPP</button>`;
}
A.wa=()=>{
  const m=meta();let t=`🥊 *Spartan Fight Fit — ${EVENTOS[S.ev].n}* 🥊\n\n👥 ${S.ad} adultos e ${S.kd} crianças · ⏱️ ${DURS[S.dur].n}\n\n🥪 *Lanches (meta ${m.l} un):*\n`;
  const L=Object.values(S.lan),B=Object.values(S.beb);
  t+=L.length?L.map(x=>`• ${x.q}x ${x.n}`).join('\n'):'Nenhum selecionado ainda.';
  t+=`\n\n🥤 *Bebidas (meta ${m.b} L):*\n`;
  t+=B.length?B.map(x=>`• ${x.q}x ${x.n} (${x.sub} - ${x.z})`).join('\n'):'Nenhuma selecionada ainda.';
  window.open('https://api.whatsapp.com/send?text='+encodeURIComponent(t),'_blank');
};
A.reset=()=>A.o('Novo evento?',()=>{$('#mb').innerHTML=`<p class="hint" style="font-size:13px;text-transform:none">Apagar tudo e começar um novo planejamento?</p><div class="act"><button class="nb" style="--c:#888" onclick="A.back()">CANCELAR</button><button class="nb" style="--c:#ff2d55" onclick="A.doReset()">SIM, LIMPAR</button></div>`;});
A.doReset=()=>{Object.assign(S,{ad:20,kd:5,dur:'media',ev:'treino',lan:{},beb:{}});save();A.close();toast('🔄 Novo evento iniciado');};

render();
</script>
</body>
</html>
